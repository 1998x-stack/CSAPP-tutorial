<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 850 340" role="img" aria-labelledby="exec-title exec-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="exec-title">Hello 的控制流与数据流</title>
        <desc id="exec-desc">上半部是从 shell 到内核加载、运行时入口和 main 的控制流；下半部是从 printf 到 C 库、write 系统调用和终端设备的输出路径。</desc>
        <defs><marker id="exec-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#477773"/></marker></defs>
        <text x="20" y="26" font-size="15" font-weight="700" font-family="sans-serif" fill="#4c7770">控制流 / 谁启动程序</text>
        <g font-family="sans-serif" text-anchor="middle">
          <rect x="20" y="48" width="170" height="72" rx="12" fill="#e7f2ec" stroke="#83b2a5"/><text x="105" y="80" font-size="20" fill="#215e60" font-weight="700">shell</text><text x="105" y="101" font-size="13" fill="#4a7571">发起执行</text>
          <rect x="238" y="48" width="170" height="72" rx="12" fill="#e9edf7" stroke="#b2b8d5"/><text x="323" y="80" font-size="19" fill="#6259a0" font-weight="700">内核 / 加载机制</text><text x="323" y="101" font-size="13" fill="#6f6f98">execve、进程映像</text>
          <rect x="456" y="48" width="170" height="72" rx="12" fill="#fff0e7" stroke="#deb494"/><text x="541" y="80" font-size="19" fill="#a65a3d" font-weight="700">启动代码</text><text x="541" y="101" font-size="13" fill="#996b52">运行时初始化</text>
          <rect x="674" y="48" width="156" height="72" rx="12" fill="#e7f2ec" stroke="#83b2a5"/><text x="752" y="88" font-size="22" fill="#215e60" font-weight="700">main()</text>
        </g>
        <g stroke="#477773" stroke-width="2.6" fill="none" marker-end="url(#exec-arrow)"><path d="M191 84 H231"/><path d="M409 84 H449"/><path d="M627 84 H667"/></g>
        <text x="20" y="167" font-size="15" font-weight="700" font-family="sans-serif" fill="#4c7770">数据流 / 谁让文本出现在终端</text>
        <g font-family="sans-serif" text-anchor="middle">
          <rect x="20" y="192" width="170" height="72" rx="12" fill="#e7f2ec" stroke="#83b2a5"/><text x="105" y="235" font-size="21" fill="#215e60" font-weight="700">printf</text>
          <rect x="238" y="192" width="170" height="72" rx="12" fill="#fff0e7" stroke="#deb494"/><text x="323" y="235" font-size="19" fill="#a65a3d" font-weight="700">C 库缓冲区</text>
          <rect x="456" y="192" width="170" height="72" rx="12" fill="#e9edf7" stroke="#b2b8d5"/><text x="541" y="228" font-size="21" fill="#6259a0" font-weight="700">write</text><text x="541" y="249" font-size="13" fill="#6f6f98">系统调用</text>
          <rect x="674" y="192" width="156" height="72" rx="12" fill="#e7f2ec" stroke="#83b2a5"/><text x="752" y="235" font-size="20" fill="#215e60" font-weight="700">终端</text>
        </g>
        <g stroke="#477773" stroke-width="2.6" fill="none" marker-end="url(#exec-arrow)"><path d="M191 228 H231"/><path d="M409 228 H449"/><path d="M627 228 H667"/></g>
        <text x="20" y="310" font-family="sans-serif" font-size="14" fill="#607975">简化模型：库实现与缓冲策略可能不同；具体系统调用可用 strace 实测。</text>
      </svg>
