<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="set-title set-desc" data-export="12-sets.svg"><title id="set-title">两个地址共享 set 0，但在两路组相联缓存中可共存</title><desc id="set-desc">S 为四组、E 为两路、B 为十六字节，0x00 和 0x40 的组索引同为零，标签分别是零和一；两个标签可同时占据组零的不同行。</desc><rect width="760" height="330" rx="16" fill="#f7faf7"/><text x="25" y="31" font-size="18" fill="#234648" font-weight="700">同一个 set，可以有多个 way</text><rect x="25" y="70" width="185" height="66" rx="8" fill="#e9f2ee" stroke="#b0c7bf"/><text x="40" y="95" font-size="17" fill="#1e5354">0x00 → set 0</text><text x="40" y="119" font-size="14" fill="#48706c">tag = 0</text><rect x="25" y="150" width="185" height="66" rx="8" fill="#f0ecec" stroke="#c6ada2"/><text x="40" y="175" font-size="17" fill="#88533d">0x40 → set 0</text><text x="40" y="199" font-size="14" fill="#88533d">tag = 1</text><path d="M210 104 h82 v76 h47" fill="none" stroke="#157c79" stroke-width="3"/><path d="M210 183 h129" stroke="#bd704e" stroke-width="3"/><path d="M330 176 l9 7 -9 7" fill="none" stroke="#bd704e" stroke-width="3"/><rect x="350" y="70" width="380" height="220" rx="11" fill="#fffdf9" stroke="#cbdad1"/><text x="369" y="98" font-size="15" fill="#36585d">组索引</text><text x="475" y="98" font-size="15" fill="#36585d">Way 0</text><text x="613" y="98" font-size="15" fill="#36585d">Way 1</text><text x="375" y="131" font-size="17" fill="#4b6a69">set 0</text><rect x="455" y="112" width="116" height="32" rx="6" fill="#d5ebdf" stroke="#c2d6cb"/><rect x="595" y="112" width="116" height="32" rx="6" fill="#f7e3d8" stroke="#ddc4b8"/><text x="375" y="172" font-size="17" fill="#4b6a69">set 1</text><rect x="455" y="153" width="116" height="32" rx="6" fill="#e9efeb" stroke="#c2d6cb"/><rect x="595" y="153" width="116" height="32" rx="6" fill="#e9efeb" stroke="#ddc4b8"/><text x="375" y="213" font-size="17" fill="#4b6a69">set 2</text><rect x="455" y="194" width="116" height="32" rx="6" fill="#e9efeb" stroke="#c2d6cb"/><rect x="595" y="194" width="116" height="32" rx="6" fill="#e9efeb" stroke="#ddc4b8"/><text x="375" y="254" font-size="17" fill="#4b6a69">set 3</text><rect x="455" y="235" width="116" height="32" rx="6" fill="#e9efeb" stroke="#c2d6cb"/><rect x="595" y="235" width="116" height="32" rx="6" fill="#e9efeb" stroke="#ddc4b8"/><text id="way0-text" x="513" y="134" font-size="14" text-anchor="middle" fill="#166863">空</text><text id="way1-text" x="653" y="134" font-size="14" text-anchor="middle" fill="#92533b">空</text><text x="513" y="175" text-anchor="middle" font-size="14" fill="#6b7d79">空</text><text x="653" y="175" text-anchor="middle" font-size="14" fill="#6b7d79">空</text><text x="513" y="216" text-anchor="middle" font-size="14" fill="#6b7d79">空</text><text x="653" y="216" text-anchor="middle" font-size="14" fill="#6b7d79">空</text><text x="513" y="257" text-anchor="middle" font-size="14" fill="#6b7d79">空</text><text x="653" y="257" text-anchor="middle" font-size="14" fill="#6b7d79">空</text><text x="26" y="268" font-size="15" fill="#45646b">按按钮逐步演示</text><text x="26" y="293" font-size="13" fill="#657c7d">图中仅展示该组状态</text></svg>
