<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" role="img" aria-labelledby="ftl-title ftl-desc" data-export="11-ftl.svg"><title id="ftl-title">FTL 将逻辑地址的更新映射到新的物理页</title><desc id="ftl-desc">主机再次写逻辑页 LBA 7，FTL 将新数据写到空闲物理页 P3，原物理页 P0 失效；之后垃圾回收可搬移有效数据并回收擦除块。</desc><rect width="760" height="265" rx="16" fill="#f7faf7"/><text x="24" y="30" font-size="17" font-weight="700" fill="#234648">逻辑页更新 ≠ 原位置覆盖</text><rect x="28" y="72" width="164" height="75" rx="11" fill="#e8f3ef" stroke="#8ab7a9"/><text x="110" y="101" text-anchor="middle" font-size="17" fill="#1c5958" font-weight="700">主机写入 LBA 7</text><text x="110" y="127" text-anchor="middle" font-size="13" fill="#47696b">第二次写入</text><path d="M194 110 h76" stroke="#16827c" stroke-width="3"/><path d="M260 104 l10 6 -10 6" fill="none" stroke="#16827c" stroke-width="3"/><rect x="273" y="72" width="145" height="75" rx="11" fill="#d7eced" stroke="#79b0b1"/><text x="345" y="102" text-anchor="middle" font-size="18" fill="#195f61" font-weight="700">FTL 映射</text><text x="345" y="125" text-anchor="middle" font-size="13" fill="#47696b">LBA 7 → P3</text><path d="M420 110 h58" stroke="#16827c" stroke-width="3"/><path d="M469 104 l10 6 -10 6" fill="none" stroke="#16827c" stroke-width="3"/><rect x="488" y="59" width="244" height="115" rx="11" fill="#fffdf9" stroke="#c7d6cc"/><text x="502" y="79" font-size="14" fill="#3c5557">NAND 物理页</text><rect x="500" y="95" width="48" height="50" rx="5" fill="#f7e4dc" stroke="#c98b73"/><text x="524" y="115" text-anchor="middle" font-size="14" fill="#385b5d">P0</text><text x="524" y="132" text-anchor="middle" font-size="12" fill="#385b5d">无效</text><rect x="557" y="95" width="48" height="50" rx="5" fill="#e8eeea" stroke="#bfd1c7"/><text x="581" y="115" text-anchor="middle" font-size="14" fill="#385b5d">P1</text><text x="581" y="132" text-anchor="middle" font-size="12" fill="#385b5d">空闲</text><rect x="614" y="95" width="48" height="50" rx="5" fill="#e8eeea" stroke="#bfd1c7"/><text x="638" y="115" text-anchor="middle" font-size="14" fill="#385b5d">P2</text><text x="638" y="132" text-anchor="middle" font-size="12" fill="#385b5d">空闲</text><rect x="671" y="95" width="48" height="50" rx="5" fill="#147f80" stroke="#bfd1c7"/><text x="695" y="115" text-anchor="middle" font-size="14" fill="white">P3</text><text x="695" y="132" text-anchor="middle" font-size="12" fill="white">新值</text><path d="M503 100 l42 42" stroke="#b66e51" stroke-width="2"/><text x="25" y="216" font-size="15" fill="#31595a">更新发生后：旧页标记为无效，新页保存有效版本</text><text x="25" y="242" font-size="14" fill="#637473">垃圾回收后续可能搬移有效页并以块为单位擦除；并非每次写入立即擦除</text></svg>
