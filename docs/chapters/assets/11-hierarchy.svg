<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" role="img" aria-labelledby="hier-title hier-desc" data-export="11-hierarchy.svg"><title id="hier-title">命中更近一层可以避免更远的数据搬运</title><desc id="hier-desc">从 CPU、L1、L2、LLC 到 DRAM 是逐级查找的概念示意；SSD 通过缺页或文件 I/O 路径参与，不属于硬件 Cache 的直接下一级。</desc><rect width="760" height="278" rx="16" fill="#f7faf7"/><text x="24" y="31" font-size="17" fill="#234648" font-weight="700">一次数据访问：优先向近处寻找</text><rect x="20" y="78" width="95" height="82" rx="11" fill="#2b5d61"/><text x="67.5" y="111" text-anchor="middle" font-size="21" fill="white" font-weight="700">CPU</text><text x="67.5" y="138" text-anchor="middle" font-size="13" fill="white">计算</text><rect x="145" y="78" width="95" height="82" rx="11" fill="#147f80"/><text x="192.5" y="111" text-anchor="middle" font-size="21" fill="white" font-weight="700">L1</text><text x="192.5" y="138" text-anchor="middle" font-size="13" fill="white">最靠近</text><rect x="270" y="78" width="95" height="82" rx="11" fill="#3f7fa7"/><text x="317.5" y="111" text-anchor="middle" font-size="21" fill="white" font-weight="700">L2</text><text x="317.5" y="138" text-anchor="middle" font-size="13" fill="white">更大</text><rect x="395" y="78" width="95" height="82" rx="11" fill="#7067ab"/><text x="442.5" y="111" text-anchor="middle" font-size="21" fill="white" font-weight="700">LLC</text><text x="442.5" y="138" text-anchor="middle" font-size="13" fill="white">共享/末级</text><rect x="520" y="78" width="95" height="82" rx="11" fill="#bd744c"/><text x="567.5" y="111" text-anchor="middle" font-size="21" fill="white" font-weight="700">DRAM</text><text x="567.5" y="138" text-anchor="middle" font-size="13" fill="white">主存</text><rect x="645" y="78" width="95" height="82" rx="11" fill="#777f86"/><text x="692.5" y="111" text-anchor="middle" font-size="21" fill="white" font-weight="700">SSD</text><text x="692.5" y="138" text-anchor="middle" font-size="13" fill="white">持久存储</text><path d="M115 119 h22" stroke="#47666a" stroke-width="2.3"/><path d="M132 114 l5 5 -5 5" fill="none" stroke="#47666a" stroke-width="2.3"/><path d="M240 119 h22" stroke="#47666a" stroke-width="2.3"/><path d="M257 114 l5 5 -5 5" fill="none" stroke="#47666a" stroke-width="2.3"/><path d="M365 119 h22" stroke="#47666a" stroke-width="2.3"/><path d="M382 114 l5 5 -5 5" fill="none" stroke="#47666a" stroke-width="2.3"/><path d="M490 119 h22" stroke="#47666a" stroke-width="2.3"/><path d="M507 114 l5 5 -5 5" fill="none" stroke="#47666a" stroke-width="2.3"/><path d="M615 119 h22" stroke="#9c7e6e" stroke-width="2.2" stroke-dasharray="5 5"/><path d="M631 114 l6 5 -6 5" fill="none" stroke="#9c7e6e" stroke-width="2"/><text x="620" y="182" text-anchor="middle" font-size="13" fill="#8e654d">缺页 / 文件 I/O</text><path d="M60 200 h630" stroke="#d1ddd8" stroke-width="2"/><text x="24" y="227" font-size="15" fill="#36575a">左侧：更靠近处理器、通常容量较小</text><text x="24" y="253" font-size="15" fill="#36575a">右侧：通常容量更大、访问代价更高；具体时延依平台而异</text></svg>
