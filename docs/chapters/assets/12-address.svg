<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" role="img" aria-labelledby="addr-title addr-desc" data-export="12-address.svg"><title id="addr-title">16 位地址按 Tag 10 位、Set 2 位、Offset 4 位拆解</title><desc id="addr-desc">示例地址 0x1234 二进制为 0001001000110100。高 10 位标签 0001001000 即 0x48，中间两位组索引 11 即 3，低四位块内偏移 0100 即 4。</desc><rect width="760" height="244" rx="16" fill="#f7faf7"/><text x="25" y="35" font-size="19" font-weight="700" fill="#24484b">地址 0x1234（假设是 16 位地址）</text><rect x="24" y="68" width="436" height="86" rx="10" fill="#7067ab"/><rect x="465" y="68" width="118" height="86" rx="9" fill="#147f80"/><rect x="588" y="68" width="146" height="86" rx="9" fill="#c1724b"/><text x="242" y="99" text-anchor="middle" font-size="17" fill="white" font-weight="700">Tag · t = 10</text><text x="242" y="127" text-anchor="middle" font-size="20" fill="white" font-family="monospace">0001001000</text><text x="524" y="99" text-anchor="middle" font-size="17" fill="white" font-weight="700">Set · s = 2</text><text x="524" y="127" text-anchor="middle" font-size="20" fill="white" font-family="monospace">11</text><text x="661" y="99" text-anchor="middle" font-size="17" fill="white" font-weight="700">Offset · b = 4</text><text x="661" y="127" text-anchor="middle" font-size="20" fill="white" font-family="monospace">0100</text><text x="54" y="192" font-size="16" fill="#4b5e6c">tag = 0x48</text><text x="465" y="192" font-size="16" fill="#156c68">组号 = 3</text><text x="605" y="192" font-size="16" fill="#a05b3e">偏移 = 4 B</text><text x="24" y="225" font-size="14" fill="#617371">S = 4 组，B = 16 B/行；示意模型使用 2 的幂参数</text></svg>
