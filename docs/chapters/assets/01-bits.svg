<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 185" role="img" aria-labelledby="bits-svg-title bits-svg-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="bits-svg-title">字符 H 如何映射到 8 位</title>
        <desc id="bits-svg-desc">左侧为字符 H，中间为十进制 72，右侧为 01001000，三者是同一字节的不同解释。</desc>
        <rect x="15" y="28" width="133" height="106" rx="15" fill="#e5f2ea" stroke="#81b9a7"/>
        <text x="81" y="94" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="47" fill="#176e70">H</text>
        <text x="178" y="83" font-family="sans-serif" font-size="22" fill="#52706f">→</text>
        <rect x="220" y="28" width="144" height="106" rx="15" fill="#f6eee7" stroke="#d9b79e"/>
        <text x="292" y="93" text-anchor="middle" font-family="sans-serif" font-weight="750" font-size="38" fill="#aa613f">72</text>
        <text x="393" y="83" font-family="sans-serif" font-size="22" fill="#52706f">→</text>
        <g font-family="monospace" font-size="26" font-weight="700" text-anchor="middle">
          <rect x="427" y="44" width="46" height="65" rx="5" fill="#dcece7"/><text x="450" y="84" fill="#1b5451">0</text>
          <rect x="475" y="44" width="46" height="65" rx="5" fill="#c9e5d9"/><text x="498" y="84" fill="#16655b">1</text>
          <rect x="523" y="44" width="46" height="65" rx="5" fill="#dcece7"/><text x="546" y="84" fill="#1b5451">0</text>
          <rect x="571" y="44" width="46" height="65" rx="5" fill="#dcece7"/><text x="594" y="84" fill="#1b5451">0</text>
          <rect x="619" y="44" width="46" height="65" rx="5" fill="#c9e5d9"/><text x="642" y="84" fill="#16655b">1</text>
          <rect x="667" y="44" width="46" height="65" rx="5" fill="#dcece7"/><text x="690" y="84" fill="#1b5451">0</text>
          <rect x="715" y="44" width="46" height="65" rx="5" fill="#dcece7"/><text x="738" y="84" fill="#1b5451">0</text>
          <rect x="763" y="44" width="43" height="65" rx="5" fill="#dcece7"/><text x="784" y="84" fill="#1b5451">0</text>
        </g>
        <g fill="#627977" font-size="14" font-family="sans-serif" text-anchor="middle"><text x="81" y="160">字符</text><text x="292" y="160">十进制</text><text x="616" y="160">二进制（8 bit）</text></g>
