<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 264" aria-labelledby="fig-title fig-desc"><title id="fig-title">让解除屏蔽与睡眠成为一个原子步骤</title><desc id="fig-desc">错误方法在检查标志与 pause 之间存在信号送达的空隙。安全方法先屏蔽信号，检查标志后通过 sigsuspend 原子地替换信号屏蔽字并睡眠；待处理信号会唤醒线程。</desc><rect width="960" height="264" rx="15" fill="#f8faf7"/><text x="24" y="35" font-size="20" font-weight="700" fill="#264942">为什么“检查 → pause”之间有竞争？</text><rect x="24" y="64" width="440" height="166" rx="12" fill="#f9e8dc" stroke="#b3cfc3"/><text x="38" y="91" font-size="17" font-weight="700" fill="#234942">❌ 不安全：while (!ready) pause()</text><rect x="36" y="111" width="136" height="82" rx="8" fill="white" stroke="#b9d6c6"/><text x="46" y="135" font-size="13" fill="#30544e">1</text><text x="46" y="165" font-size="12.5" fill="#30544e">检查 ready=0</text><rect x="179" y="111" width="136" height="82" rx="8" fill="white" stroke="#b9d6c6"/><text x="189" y="135" font-size="13" fill="#30544e">2</text><text x="189" y="165" font-size="12.5" fill="#30544e">SIGUSR1 送达、ready=1</text><rect x="322" y="111" width="136" height="82" rx="8" fill="white" stroke="#b9d6c6"/><text x="332" y="135" font-size="13" fill="#30544e">3</text><text x="332" y="165" font-size="12.5" fill="#30544e">进入 pause（可能睡住）</text><rect x="496" y="64" width="440" height="166" rx="12" fill="#e0f2e9" stroke="#b3cfc3"/><text x="510" y="91" font-size="17" font-weight="700" fill="#234942">安全：block → sigsuspend</text><rect x="508" y="111" width="136" height="82" rx="8" fill="white" stroke="#b9d6c6"/><text x="518" y="135" font-size="13" fill="#30544e">1</text><text x="518" y="165" font-size="12.5" fill="#30544e">先 block SIGUSR1</text><rect x="651" y="111" width="136" height="82" rx="8" fill="white" stroke="#b9d6c6"/><text x="661" y="135" font-size="13" fill="#30544e">2</text><text x="661" y="165" font-size="12.5" fill="#30544e">发送后保持 pending</text><rect x="794" y="111" width="136" height="82" rx="8" fill="white" stroke="#b9d6c6"/><text x="804" y="135" font-size="13" fill="#30544e">3</text><text x="804" y="165" font-size="12.5" fill="#30544e">原子解屏蔽并等待 → 递送</text><text x="24" y="253" font-size="13" fill="#527168">sigsuspend 允许在原子交换掩码之后睡眠；有 pending 信号时会递送后返回</text></svg>