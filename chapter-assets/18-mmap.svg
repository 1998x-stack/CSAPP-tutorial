<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="s18m-title s18m-desc"><title id="s18m-title">匿名映射的按需物理页分配</title><desc id="s18m-desc">mmap建立虚拟映射后第一次写入可能触发缺页和物理页关联，后续访问复用映射</desc><rect width="880" height="300" fill="#fbfcf8"/><text x="440" y="30" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">私有匿名映射的常见按需路径</text><rect x="20" y="78" width="260" height="128" rx="10" fill="#e8edea" stroke="#c9d9d0" stroke-width="1.6"/><text x="150" y="117" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">mmap 成功</text><text x="150" y="153" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" text-anchor="middle">虚拟区域已建立</text><text x="150" y="182" fill="#58716d" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">物理页可尚未关联</text><path d="M282,142 L306,142" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M306 142 L296.3465918192059 147.27368092464624 M306 142 L296.3465918192059 136.72631907535376" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><rect x="309" y="78" width="260" height="128" rx="10" fill="#f5e4d9" stroke="#c9d9d0" stroke-width="1.6"/><text x="439" y="117" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">第一次写入</text><text x="439" y="153" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" text-anchor="middle">缺页处理 / 清零页框</text><text x="439" y="182" fill="#58716d" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">建立可写映射</text><path d="M571,142 L595,142" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M595 142 L585.3465918192059 147.27368092464624 M595 142 L585.3465918192059 136.72631907535376" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><rect x="598" y="78" width="260" height="128" rx="10" fill="#dfeee5" stroke="#c9d9d0" stroke-width="1.6"/><text x="728" y="117" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">后续访问</text><text x="728" y="153" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" text-anchor="middle">使用已建立映射</text><text x="728" y="182" fill="#58716d" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">TLB 可缓存翻译</text><text x="440" y="254" fill="#526e69" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">不是所有首次读取都独占分配物理页：可能先映射只读零页</text><text x="440" y="281" fill="#526e69" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">munmap 撤销映射；是否释放所有物理资源取决于引用和内核管理</text></svg>