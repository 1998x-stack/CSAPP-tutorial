<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="s17t-title s17t-desc"><title id="s17t-title">TLB miss与page fault区分</title><desc id="s17t-desc">TLB miss时硬件可能完成页表遍历；仅当映射或权限不满足时才可能陷入缺页处理</desc><rect width="880" height="310" fill="#fbfcf8"/><text x="440" y="30" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">一次地址访问的分叉</text><rect x="25" y="74" width="198" height="72" rx="10" fill="#e2eee7" stroke="#c9d9d0" stroke-width="1.6"/><text x="124" y="103" fill="#116e68" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" text-anchor="middle">查询 TLB</text><text x="124" y="126" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle">虚拟页翻译缓存</text><rect x="335" y="53" width="219" height="78" rx="10" fill="#dcefe5" stroke="#c9d9d0" stroke-width="1.6"/><text x="444" y="84" fill="#126c68" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" text-anchor="middle">命中</text><text x="444" y="113" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">直接得到页框</text><rect x="335" y="169" width="219" height="78" rx="10" fill="#f6e7df" stroke="#e8c1af" stroke-width="1.6"/><text x="444" y="198" fill="#9a5c43" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" text-anchor="middle">未命中</text><text x="444" y="226" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">查页表 / 填 TLB</text><rect x="670" y="53" width="185" height="78" rx="10" fill="#e7f0e7" stroke="#c9d9d0" s