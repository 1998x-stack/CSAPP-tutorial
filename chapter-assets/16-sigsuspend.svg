<svg xmlns="http://www.w3.org/2000/svg" width="880" height="315" viewBox="0 0 880 315" role="img" aria-labelledby="s16s-title s16s-desc"><title id="s16s-title">sigsuspend消除检查等待竞态</title><desc id="s16s-desc">错误代码检查标志后再暂停可能错过事件；正确代码先阻塞信号并通过sigsuspend原子解除屏蔽和等待</desc><rect width="880" height="315" fill="#fbfcf8"/><text x="440" y="30" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">为什么 if (!got) pause() 会错过信号？</text><rect x="29" y="60" width="398" height="98" rx="10" fill="#f9e8df" stroke="#e7bdaa" stroke-width="1.6"/><text x="226" y="90" fill="#995a40" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">有竞态：先检查 → 信号到达 → pause</text><text x="226" y="119" fill="#8e6652" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">信号已处理，pause 可能继续等待</text><rect x="453" y="60" width="398" height="98" rx="10" fill="#dcefe8" stroke="#9dc6b8" stroke-width="1.6"/><text x="652" y="90" fill="#146b65" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">无竞态：屏蔽 → 检查 → sigsuspend</text><text x="652" y="119" fill="#4d746b" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">原子解除屏蔽并等待，随后恢复掩码</text><text x="160" y="204" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle">检查</text><path d="M205,199 L286,199" fill="none" stroke="#b87d5b" stroke-width="3" stroke-linecap="round"/><path d="M286 199 L276.3465918192059 204.27368092464624 M286 199 L276.3465918192059 193.72631907535376" fill="none" stroke="#b87d5b" stroke-width="3" stroke-linecap="round"/><text x="330" y="204" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle">pause</text><text x="440" y="204" fill="#a76149" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="600" text-anchor="middle">✕</text><text x="590" y="204" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle">屏蔽</text><path d="M650,199 L710,199" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M710 199 L700.3465918192059 204.27368092464624 M710 199 L700.3465918192059 193.72631907535376" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><text x="784" y="204" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle">等待</text><text x="440" y="268" fill="#536c69" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">错误等待的关键不是信号“丢了”，而是等待与状态检查之间不具原子性</text></svg>