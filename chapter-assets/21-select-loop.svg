<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 275" role="img" aria-labelledby="t d"><title id="t">select 监听多个文件描述符的就绪状态</title><desc id="d">事件循环同时监控监听 fd 和两个客户端，客户端 B 就绪时只处理 B，下一轮重新准备集合。</desc><rect width="920" height="275" rx="18" fill="#f6f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="19"><rect x="30" y="92" width="218" height="86" rx="14" fill="#d8efea" stroke="#147f80"/><text x="139" y="126" fill="#285e5e">select 就绪集合</text><text x="139" y="154" fill="#285e5e">下一轮重新准备</text><rect x="352" y="32" width="230" height="55" rx="9" fill="#eeeae5" stroke="#899894"/><text x="466" y="65" fill="#62736f">监听 fd：未就绪</text><rect x="352" y="109" width="230" height="55" rx="9" fill="#eeeae5" stroke="#899894"/><text x="466" y="142" fill="#62736f">客户端 A：未就绪</text><rect x="352" y="187" width="230" height="55" rx="9" fill="#d8efea" stroke="#147f80"/><text x="466" y="220" fill="#235e61">客户端 B：可读</text><rect x="676" y="187" width="213" height="55" rx="9" fill="#e9e3fb" stroke="#7461ba"/><text x="781" y="220" fill="#554583">处理 B 的数据</text></g><g stroke="#7f9a94" stroke-width="3" fill="none"><path d="M248 120 L352 60"/><path d="M248 135 L352 136"/><path d="M248 150 L352 211"/><path d="M582 215 L676 215" stroke="#7461ba"/></g></svg>