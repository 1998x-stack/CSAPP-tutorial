<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 264"><title id="title">相同 128 字节容量下直接映射与两路组相联命中轨迹</title><desc id="desc">地址零和一百二十八都映射到组零。直接映射一行反复替换，四次均未命中；两路缓存的两个位置分别保存两个块，第三、四次命中。</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="36" font-size="21" font-weight="700" fill="#234b43">地址 0x00、0x80、0x00、0x80：同容量，不同结果</text><rect x="24" y="63" width="438" height="179" rx="12" fill="#fff" stroke="#d6e3dc"/><text x="40" y="89" font-size="17" font-weight="700" fill="#9e623f">直接映射 · S=8, E=1</text><rect x="40" y="105" width="406" height="29" rx="6" fill="#e8f0ec"/><text x="52" y="125" font-size="15" fill="#244640">set 0: 仅一个 Way</text><rect x="40" y="137" width="406" height="29" rx="6" fill="#e1f0e7"/><text x="52" y="157" font-size="15" fill="#244640">0x00 → tag 0，占用</text><rect x="40" y="169" width="406" height="29" rx="6" fill="#f9eadb"/><text x="52" y="189" font-size="15" fill="#244640">0x80 → tag 1，驱逐 tag 0</text><text x="42" y="224" font-size="18" font-weight="700" fill="#9e623f">M → M → M → M</text><rect x="496" y="63" width="438" height="179" rx="12" fill="#fff" stroke="#d6e3dc"/><text x="512" y="89" font-size="17" font-weight="700" fill="#14766d">两路组相联 · S=4, E=2</text><rect x="512" y="105" width="406" height="29" rx="6" fill="#e8f0ec"/><text x="524" y="125" font-size="15" fill="#244640">set 0: Way 0 / Way 1</text><rect x="512" y="137" width="406" height="29" rx="6" fill="#e1f0e7"/><text x="524" y="157" font-size="15" fill="#244640">Way 0 保存 tag 0</text><rect x="512" y="169" width="406" height="29" rx="6" fill="#f9eadb"/><text x="524" y="189" font-size="15" fill="#244640">Way 1 保存 tag 2</text><text x="514" y="224" font-size="18" font-weight="700" fill="#14766d">M → M → H → H</text><text x="27" y="258" font-size="13" fill="#536b63">M=未命中，H=命中；忽略其他访问和一致性失效</text></svg>