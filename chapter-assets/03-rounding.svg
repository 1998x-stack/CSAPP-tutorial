<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="rounding-title rounding-desc"><title id="rounding-title">中点取偶示意</title><desc id="rounding-desc">在整数间距一的玩具网格里，2.5取2，3.5取4</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="34" fill="#203035" font-size="23" font-weight="600" text-anchor="middle">只看中点：恰好一半时选偶数格点</text><path d="M100 102 L660 102" fill="none" stroke="#90a9a3" stroke-width="3"/><circle cx="100" cy="102" r="8" fill="#137e80"/><text x="100" y="87" fill="#235d5d" font-size="20" font-weight="600" text-anchor="middle">2</text><circle cx="380" cy="102" r="8" fill="#dca77f"/><text x="380" y="87" fill="#ab6a45" font-size="20" font-weight="600" text-anchor="middle">2.5</text><circle cx="660" cy="102" r="8" fill="#137e80"/><text x="660" y="87" fill="#235d5d" font-size="20" font-weight="600" text-anchor="middle">3</text><text x="743" y="110" fill="#215e62" font-size="19" font-weight="600" text-anchor="middle">2.5 → 2（偶）</text><path d="M100 217 L660 217" fill="none" stroke="#90a9a3" stroke-width="3"/><circle cx="100" cy="217" r="8" fill="#137e80"/><text x="100" y="202" fill="#235d5d" font-size="20" font-weight="600" text-anchor="middle">3</text><circle cx="380" cy="217" r="8" fill="#dca77f"/><text x="380" y="202" fill="#ab6a45" font-size="20" font-weight="600" text-anchor="middle">3.5</text><circle cx="660" cy="217" r="8" fill="#137e80"/><text x="660" y="202" fill="#235d5d" font-size="20" font-weight="600" text-anchor="middle">4</text><text x="743" y="225" fill="#215e62" font-size="19" font-weight="600" text-anchor="middle">3.5 → 4（偶）</text></svg>