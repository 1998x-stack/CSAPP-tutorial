oke="#c9d9d0" stroke-width="1.6"/><text x="615" y="234" fill="#346e69" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">索引 0…511</text><rect x="708" y="201" width="157" height="54" rx="10" fill="#f6e6db" stroke="#c9d9d0" stroke-width="1.6"/><text x="786" y="234" fill="#a16c50" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">页内位置</text><text x="440" y="288" fill="#5b7471" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">四级仅是这一种模式；5 级分页和大页会改变遍历层数</text></svg>