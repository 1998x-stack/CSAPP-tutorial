<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">延迟界与吞吐界的相遇</title><desc id="figure-desc">一条依赖链;L = 4 cycles;K=1 → 4 cycles/element → 四条独立链;L/K = 1;K=4 → ≥1 cycle/element → 吞吐量上限;R = 2 ops/cycle;K=8 → ≥0.5 cycles/element</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#254744">延迟界与吞吐界的相遇</text><rect x="24" y="65" width="284" height="128" rx="12" stroke="#126b67" fill="#e5f2ed"/><text x="39" y="91" font-size="14" font-weight="750" fill="#126b67">一条依赖链</text><text x="39" y="127" font-size="19" font-weight="700" fill="#24413e">L = 4 cycles</text><text x="39" y="165" font-size="15" fill="#526a63">K=1 → 4 cycles/element</text><path d="M311 127 H330" stroke="#4c7a73" stroke-width="2.5"/><path d="M324 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="333" y="65" width="284" height="128" rx="12" stroke="#ac673d" fill="#fff1e4"/><text x="348" y="91" font-size="14" font-weight="750" fill="#ac673d">四条独立链</text><text x="348" y="127" font-size="19" font-weight="700" fill="#24413e">L/K = 1</text><text x="348" y="165" font-size="15" fill="#526a63">K=4 → ≥1 cycle/element</text><path d="M620 127 H639" stroke="#4c7a73" stroke-width="2.5"/><path d="M633 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="642" y="65" width="284" height="128" rx="12" stroke="#6655a7" fill="#eeeafa"/><text x="657" y="91" font-size="14" font-weight="750" fill="#6655a7">吞吐量上限</text><text x="657" y="127" font-size="19" font-weight="700" fill="#24413e">R = 2 ops/cycle</text><text x="657" y="165" font-size="15" fill="#526a63">K=8 → ≥0.5 cycles/element</text><rect x="25" y="211" width="910" height="35" rx="7" fill="#e4eee8"/><text x="42" y="235" font-size="15" fill="#245e57">教学下界：CPE ≥ max(L/K, 1/R)，非任何具体芯片的实测值</text></svg>