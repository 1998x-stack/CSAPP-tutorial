<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">相同读取次数，不同数据搬运</title><desc id="figure-desc">Stride = 1;64 条 64B Cache line;1 个 4KiB page → Stride = 16;1024 条 Cache line;16 个 page → Stride = 1024;1024 条 Cache line;1024 个 page</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#254744">相同读取次数，不同数据搬运</text><rect x="24" y="65" width="284" height="128" rx="12" stroke="#126b67" fill="#e5f2ed"/><text x="39" y="91" font-size="14" font-weight="750" fill="#126b67">Stride = 1</text><text x="39" y="127" font-size="19" font-weight="700" fill="#24413e">64 条 64B Cache line</text><text x="39" y="165" font-size="15" fill="#526a63">1 个 4KiB page</text><path d="M311 127 H330" stroke="#4c7a73" stroke-width="2.5"/><path d="M324 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="333" y="65" width="284" height="128" rx="12" stroke="#ac673d" fill="#fff1e4"/><text x="348" y="91" font-size="14" font-weight="750" fill="#ac673d">Stride = 16</text><text x="348" y="127" font-size="19" font-weight="700" fill="#24413e">1024 条 Cache line</text><text x="348" y="165" font-size="15" fill="#526a63">16 个 page</text><path d="M620 127 H639" stroke="#4c7a73" stroke-width="2.5"/><path d="M633 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="642" y="65" width="284" height="128" rx="12" stroke="#6655a7" fill="#eeeafa"/><text x="657" y="91" font-size="14" font-weight="750" fill="#6655a7">Stride = 1024</text><text x="657" y="127" font-size="19" font-weight="700" fill="#24413e">1024 条 Cache line</text><text x="657" y="165" font-size="15" fill="#526a63">1024 个 page</text><rect x="25" y="211" width="910" height="35" rx="7" fill="#e4eee8"/><text x="42" y="235" font-size="15" fill="#245e57">假设 int 4B、行 64B、页 4KiB、1024 次读取且初始都未驻留</text></svg>