<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="endian-title endian-desc"><title id="endian-title">字节序对比</title><desc id="endian-desc">地址由低到高，大端与小端排列相反但数值相等</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="34" fill="#203035" font-size="24" font-weight="600" text-anchor="middle">同一数值：0x12345678</text><rect x="180" y="55" width="145" height="45" rx="10" fill="#e8efeb" stroke="#dee7df" stroke-width="1.5"/><text x="252" y="84" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">0x100</text><rect x="343" y="55" width="145" height="45" rx="10" fill="#e8efeb" stroke="#dee7df" stroke-width="1.5"/><text x="415" y="84" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">0x101</text><rect x="506" y="55" width="145" height="45" rx="10" fill="#e8efeb" stroke="#dee7df" stroke-width="1.5"/><text x="578" y="84" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">0x102</text><rect x="669" y="55" width="145" height="45" rx="10" fill="#e8efeb" stroke="#dee7df" stroke-width="1.5"/><text x="741" y="84" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">0x103</text><text x="82" y="137" fill="#83603c" font-size="21" font-weight="600" text-anchor="middle">大端</text><text x="82" y="156" fill="#74665b" font-size="14" font-weight="600" text-anchor="middle">低地址先放高位</text><text x="82" y="240" fill="#147f80" font-size="21" font-weight="600" text-anchor="middle">小端</text><text x="82" y="259" fill="#53676d" font-size="14" font-weight="600" text-anchor="middle">低地址先放低位</text><rect x="180" y="105" width="145" height="69" rx="10" fill="#f1d9c8" stroke="#c99e88" stroke-width="1.5"/><text x="252" y="147" fill="#8e5439" font-size="26" font-weight="600" text-anchor="middle">0x12</text><rect x="180" y="209" width="145" height="69" rx="10" fill="#cce8df" stroke="#91bfb5" stroke-width="1.5"/><text x="252" y="251" fill="#126e6d" font-size="26" font-weight="600" text-anchor="middle">0x78</text><rect x="343" y="105" width="145" height="69" rx="10" fill="#f2e7de" stroke="#c99e88" stroke-width="1.5"/><text x="415" y="147" fill="#8e5439" font-size="26" font-weight="600" text-anchor="middle">0x34</text><rect x="343" y="209" width="145" height="69" rx="10" fill="#e3f2ed" stroke="#91bfb5" stroke-width="1.5"/><text x="415" y="251" fill="#126e6d" font-size="26" font-weight="600" text-anchor="middle">0x56</text><rect x="506" y="105" width="145" height="69" rx="10" fill="#f2e7de" stroke="#c99e88" stroke-width="1.5"/><text x="578" y="147" fill="#8e5439" font-size="26" font-weight="600" text-anchor="middle">0x56</text><rect x="506" y="209" width="145" height="69" rx="10" fill="#e3f2ed" stroke="#91bfb5" stroke-width="1.5"/><text x="578" y="251" fill="#126e6d" font-size="26" font-weight="600" text-anchor="middle">0x34</text><rect x="669" y="105" width="145" height="69" rx="10" fill="#f2e7de" stroke="#c99e88" stroke-width="1.5"/><text x="741" y="147" fill="#8e5439" font-size="26" font-weight="600" text-anchor="middle">0x78</text><rect x="669" y="209" width="145" height="69" rx="10" fill="#e3f2ed" stroke="#91bfb5" stroke-width="1.5"/><text x="741" y="251" fill="#126e6d" font-size="26" font-weight="600" text-anchor="middle">0x12</text><text x="440" y="300" fill="#5e7373" font-size="17" font-weight="600" text-anchor="middle">地址递增 →</text></svg>