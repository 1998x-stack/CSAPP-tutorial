<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="binary32-title binary32-desc"><title id="binary32-title">binary32字段解剖</title><desc id="binary32-desc">二进制浮点格式含符号、指数字段和小数字段，以0.15625为例</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="35" fill="#203035" font-size="24" font-weight="600" text-anchor="middle">binary32：1 + 8 + 23 = 32 位</text><rect x="34" y="78" width="108" height="93" rx="10" fill="#e7dcf6" stroke="#dee7df" stroke-width="1.5"/><text x="88" y="111" fill="#203035" font-size="20" font-weight="600" text-anchor="middle">符号 s</text><text x="88" y="146" fill="#334e4e" font-size="23" font-weight="600" text-anchor="middle">0</text><rect x="148" y="78" width="232" height="93" rx="10" fill="#e9e0ca" stroke="#dee7df" stroke-width="1.5"/><text x="264" y="111" fill="#203035" font-size="20" font-weight="600" text-anchor="middle">阶码 e</text><text x="264" y="146" fill="#334e4e" font-size="23" font-weight="600" text-anchor="middle">01111100</text><rect x="386" y="78" width="462" height="93" rx="10" fill="#dcefe8" stroke="#dee7df" stroke-width="1.5"/><text x="617" y="111" fill="#203035" font-size="20" font-weight="600" text-anchor="middle">小数字段 f</text><text x="617" y="146" fill="#334e4e" font-size="18" font-weight="600" text-anchor="middle">01000000000000000000000</text><text x="440" y="219" fill="#284746" font-size="25" font-weight="600" text-anchor="middle">0.15625 = 1.01₂ × 2⁻³</text><text x="440" y="260" fill="#667775" font-size="20" font-weight="600" text-anchor="middle">E = 124 − 127 = −3   ·   M = 1.01₂</text><text x="440" y="292" fill="#136e6d" font-size="20" font-weight="600" text-anchor="middle">编码：0x3e200000</text></svg>