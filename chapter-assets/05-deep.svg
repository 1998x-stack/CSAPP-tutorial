<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">8 位比较为什么出现 SF=0，却仍然有符号小于？</title><desc id="figure-desc">相同位模式: 0x80 − 0x01: signed: −128 − 1; 截断结果: 0x7f: SF=0, OF=1, CF=0; 两类分支: JL=真 · JB=假: SF≠OF / CF=1</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#254744">条件码不能只看符号位</text><rect x="24" y="65" width="284" height="128" rx="12" stroke="#126b67" fill="#e5f2ed"/><text x="39" y="91" font-size="14" font-weight="750" fill="#126b67">相同位模式</text><text x="39" y="127" font-size="19" font-weight="700" fill="#24413e">0x80 − 0x01</text><text x="39" y="165" font-size="15" fill="#526a63">signed: −128 − 1</text><path d="M311 127 H330" stroke="#4c7a73" stroke-width="2.5"/><path d="M324 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="333" y="65" width="284" height="128" rx="12" stroke="#ac673d" fill="#fff1e4"/><text x="348" y="91" font-size="14" font-weight="750" fill="#ac673d">截断结果</text><text x="348" y="127" font-size="19" font-weight="700" fill="#24413e">0x7f</text><text x="348" y="165" font-size="15" fill="#526a63">SF=0, OF=1, CF=0</text><path d="M620 127 H639" stroke="#4c7a73" stroke-width="2.5"/><path d="M633 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="642" y="65" width="284" height="128" rx="12" stroke="#6655a7" fill="#eeeafa"/><text x="657" y="91" font-size="14" font-weight="750" fill="#6655a7">两类分支</text><text x="657" y="127" font-size="19" font-weight="700" fill="#24413e">JL=真 · JB=假</text><text x="657" y="165" font-size="15" fill="#526a63">SF≠OF / CF=1</text><rect x="25" y="211" width="910" height="35" rx="7" fill="#e4eee8"/><text x="42" y="235" font-size="15" fill="#245e57">有符号：−128 &lt; 1；无符号：128 不小于 1</text></svg>