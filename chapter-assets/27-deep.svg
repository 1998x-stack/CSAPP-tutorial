<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t27 desc27">
<title id="t27">RV64I 指令字的字段划分与解码顺序</title>
<desc id="desc27">一个 32 位指令字。R 型按高位到低位划分为 funct7、rs2、rs1、funct3、rd、opcode；I 型划分为 12 位立即数 imm、rs1、funct3、rd、opcode。opcode 决定使用哪种格式，funct3 与 funct7 在同一格式内选择具体操作，立即数需要符号扩展。图中 add 是 R 型、ld 是 I 型。</desc>
<rect width="960" height="340" rx="15" fill="#f8fbfb"/>
<text x="22" y="36" font-size="20" font-weight="700" fill="#1f4a52">32 位指令字：先看 opcode 选格式，再取其余字段</text>
<text x="20" y="96" font-size="15" font-weight="700" fill="#1f4a52">R 型</text>
<g font-size="12" fill="#2c5257">
<rect x="180" y="66" width="166" height="54" rx="7" fill="#e7f2f2" stroke="#bfd7d5"/>
<rect x="346" y="66" width="119" height="54" rx="7" fill="#f6efe2" stroke="#bfd7d5"/>
<rect x="465" y="66" width="119" height="54" rx="7" fill="#eceff7" stroke="#bfd7d5"/>
<rect x="584" y="66" width="71" height="54" rx="7" fill="#e7f2f2" stroke="#bfd7d5"/>
<rect x="655" y="66" width="119" height="54" rx="7" fill="#f6efe2" stroke="#bfd7d5"/>
<rect x="774" y="66" width="166" height="54" rx="7" fill="#eceff7" stroke="#bfd7d5"/>
</g>
<text x="263" y="90" font-size="14" text-anchor="middle" fill="#1f4a52">funct7</text>
<text x="263" y="108" font-size="12" text-anchor="middle" fill="#2c5257">31:25</text>
<text x="405" y="90" font-size="14" text-anchor="middle" fill="#1f4a52">rs2</text>
<text x="405" y="108" font-size="12" text-anchor="middle" fill="#2c5257">24:20</text>
<text x="524" y="90" font-size="14" text-anchor="middle" fill="#1f4a52">rs1</text>
<text x="524" y="108" font-size="12" text-anchor="middle" fill="#2c5257">19:15</text>
<text x="619" y="90" font-size="14" text-anchor="middle" fill="#1f4a52">f3</text>
<text x="619" y="108" font-size="12" text-anchor="middle" fill="#2c5257">14:12</text>
<text x="714" y="90" font-size="14" text-anchor="middle" fill="#1f4a52">rd</text>
<text x="714" y="108" font-size="12" text-anchor="middle" fill="#2c5257">11:7</text>
<text x="857" y="90" font-size="14" text-anchor="middle" fill="#1f4a52">opcode</text>
<text x="857" y="108" font-size="12" text-anchor="middle" fill="#2c5257">6:0</text>
<text x="20" y="200" font-size="15" font-weight="700" fill="#1f4a52">I 型</text>
<g font-size="12" fill="#2c5257">
<rect x="180" y="170" width="285" height="54" rx="7" fill="#e7f2f2" stroke="#bfd7d5"/>
<rect x="465" y="170" width="119" height="54" rx="7" fill="#eceff7" stroke="#bfd7d5"/>
<rect x="584" y="170" width="71" height="54" rx="7" fill="#f6efe2" stroke="#bfd7d5"/>
<rect x="655" y="170" width="119" height="54" rx="7" fill="#eceff7" stroke="#bfd7d5"/>
<rect x="774" y="170" width="166" height="54" rx="7" fill="#e7f2f2" stroke="#bfd7d5"/>
</g>
<text x="322" y="194" font-size="14" text-anchor="middle" fill="#1f4a52">imm[11:0]（符号扩展）</text>
<text x="322" y="212" font-size="12" text-anchor="middle" fill="#2c5257">31:20</text>
<text x="524" y="194" font-size="14" text-anchor="middle" fill="#1f4a52">rs1</text>
<text x="524" y="212" font-size="12" text-anchor="middle" fill="#2c5257">19:15</text>
<text x="619" y="194" font-size="14" text-anchor="middle" fill="#1f4a52">f3</text>
<text x="619" y="212" font-size="12" text-anchor="middle" fill="#2c5257">14:12</text>
<text x="714" y="194" font-size="14" text-anchor="middle" fill="#1f4a52">rd</text>
<text x="714" y="212" font-size="12" text-anchor="middle" fill="#2c5257">11:7</text>
<text x="857" y="194" font-size="14" text-anchor="middle" fill="#1f4a52">opcode</text>
<text x="857" y="212" font-size="12" text-anchor="middle" fill="#2c5257">6:0</text>
<rect x="22" y="256" width="916" height="64" rx="10" fill="#e9f3f2" stroke="#bfd7d5"/>
<text x="38" y="282" font-size="14" fill="#2c5257"><tspan font-weight="700" fill="#1f4a52">add</tspan>：R 型，opcode 0110011、funct3 000、funct7 0000000；<tspan font-weight="700" fill="#1f4a52">ld</tspan>：I 型，opcode 0000011、funct3 011、imm 为 12 位有符号偏移。</text>
<text x="38" y="306" font-size="14" fill="#2c5257">字段位置来自 ISA 规范；同一位模式在何种格式下解释为哪条指令，由 opcode 与 funct 共同决定。</text>
</svg>
