<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 264" aria-labelledby="fig-title fig-desc"><title id="fig-title">碎片与合并：总空闲不等于最大连续块</title><desc id="fig-desc">固定块池依次为F64、A32、F64、B32、F32；空闲160字节但最长连续空闲块只有64字节，96字节申请失败；释放A32后相邻F64+A32+F64可合并成160字节，96字节申请变得可行。</desc><rect width="960" height="264" rx="15" fill="#f8faf7"/><text x="25" y="35" font-size="20" font-weight="700" fill="#244944">固定池里 160 B 空闲，但没有连续 96 B</text><text x="24" y="88" fill="#2e5e53" font-size="15" font-weight="700">释放前</text><rect x="146" y="68" width="249.6" height="42" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="270.8" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F64</text><rect x="400.6" y="68" width="124.8" height="42" rx="5" fill="#ffe5d3" stroke="#bd7755"/><text x="463" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">A32</text><rect x="530.4000000000001" y="68" width="249.6" height="42" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="655.2" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F64</text><rect x="785.0000000000001" y="68" width="124.8" height="42" rx="5" fill="#ffe5d3" stroke="#bd7755"/><text x="847.4000000000001" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">B32</text><rect x="914.8000000000002" y="68" width="124.8" height="42" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="977.2000000000002" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F32</text><text x="24" y="164" fill="#2e5e53" font-size="15" font-weight="700">释放 A 后</text><rect x="146" y="144" width="624" height="42" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="458" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F160</text><rect x="775" y="144" width="124.8" height="42" rx="5" fill="#ffe5d3" stroke="#bd7755"/><text x="837.4" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">B32</text><rect x="904.8" y="144" width="124.8" height="42" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="967.1999999999999" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F32</text><text x="25" y="240" font-size="15" fill="#42665d">申请 96 B：释放前最大 F64，失败；合并后得到 F160，可满足</text></svg>