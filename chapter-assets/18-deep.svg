<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 264" aria-labelledby="fig-title fig-desc"><title id="fig-title">释放一个占用块后如何合并相邻空闲块</title><desc id="fig-desc">释放前是 F64 A32 F64 B32 F32，空闲总量160但最大块64；释放 A 并合并后是 F160 B32 F32，最大可用块160，因而可满足96字节请求。此图是固定池不含头部开销的模型。</desc><rect width="960" height="264" rx="15" fill="#f8faf7"/><text x="25" y="35" font-size="20" font-weight="700" fill="#244944">固定池里 160 B 空闲，却没有连续 96 B</text><text x="24" y="90" fill="#2e5e53" font-size="15" font-weight="700">释放前</text><rect x="145.0" y="68" width="211.2" height="43" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="250.6" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F64</text><rect x="361.2" y="68" width="105.6" height="43" rx="5" fill="#ffe5d3" stroke="#bd7755"/><text x="414.0" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">A32</text><rect x="471.8" y="68" width="211.2" height="43" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="577.4" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F64</text><rect x="688.0" y="68" width="105.6" height="43" rx="5" fill="#ffe5d3" stroke="#bd7755"/><text x="740.8" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">B32</text><rect x="798.6" y="68" width="105.6" height="43" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="851.4" y="95" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F32</text><text x="24" y="166" fill="#2e5e53" font-size="15" font-weight="700">释放 A 后</text><rect x="145.0" y="144" width="528.0" height="43" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="409.0" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F160</text><rect x="678.0" y="144" width="105.6" height="43" rx="5" fill="#ffe5d3" stroke="#bd7755"/><text x="730.8" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">B32</text><rect x="788.6" y="144" width="105.6" height="43" rx="5" fill="#dff1e5" stroke="#4c9985"/><text x="841.4" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#284a43">F32</text><path d="M348 115 V133 H348" stroke="#21806c" stroke-width="2"/><text x="25" y="244" font-size="14" fill="#42665d">申请 96 B：释放前最大 F64 → 失败；相邻空闲块合并 F160 → 可成功</text></svg>