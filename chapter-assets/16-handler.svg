<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="s16h-title s16h-desc"><title id="s16h-title">处理函数与主程序职责</title><desc id="s16h-desc">处理函数最少操作写入标志并返回，主程序再执行复杂清理逻辑</desc><rect width="880" height="300" fill="#fbfcf8"/><text x="440" y="35" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">主程序的复杂工作，尽量留在主程序里</text><rect x="44" y="72" width="310" height="154" rx="10" fill="#e7f1ed" stroke="#c9d9d0" stroke-width="1.6"/><text x="199" y="105" fill="#1a6c67" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">主程序</text><text x="199" y="138" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">正常执行 / 资源清理</text><text x="199" y="171" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">读取 flag 后处理事件</text><text x="199" y="205" fill="#58726d" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">常规代码允许适当 I/O</text><rect x="520" y="72" width="310" height="154" rx="10" fill="#f6e7db" stroke="#dbba9e" stroke-width="1.6"/><text x="675" y="105" fill="#9a6342" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="600" text-anchor="middle">信号处理函数</text><text x="675" y="147" fill="#9a6342" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" text-anchor="middle">got_signal = 1</text><text x="675" y="188" fill="#855e51" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">不调用 printf / malloc</text><path d="M355,135 L515,135" fill="none" stroke="#b57d59" stroke-width="3" stroke-linecap="round"/><path d="M515 135 L505.3465918192059 140.27368092464624 M515 135 L505.3465918192059 129.72631907535376" fill="none" stroke="#b57d59" stroke-width="3" stroke-linecap="round"/><text x="435" y="120" fill="#8d7566" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle">中断</text><path d="M515,212 L359,212" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M359 212 L368.6534081807941 206.72631907535376 M359 212 L368.6534081807941 217.27368092464624" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><text x="435" y="234" fill="#15716b" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle">返回</text><text x="440" y="280" fill="#5d7471" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">volatile sig_atomic_t 用于简单通知；不是跨线程万能同步</text></svg>