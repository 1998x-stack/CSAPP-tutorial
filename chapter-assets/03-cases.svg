<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="cases-title cases-desc"><title id="cases-title">浮点数类别</title><desc id="cases-desc">由阶码和小数字段共同区分零次正规数正规格化数无穷大与NaN</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="30" fill="#203035" font-size="23" font-weight="600" text-anchor="middle">先看阶码，再看小数字段</text><rect x="35" y="53" width="235" height="47" rx="10" fill="#ede7e3" stroke="#dee7df" stroke-width="1.5"/><text x="152" y="83" fill="#203035" font-size="19" font-weight="600" text-anchor="middle">阶码全零</text><rect x="285" y="53" width="240" height="47" rx="10" fill="#f7f8f5" stroke="#dee7df" stroke-width="1.5"/><text x="405" y="83" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">小数字段为零</text><rect x="539" y="53" width="300" height="47" rx="10" fill="#ede7e3" stroke="#dee7df" stroke-width="1.5"/><text x="689" y="83" fill="#215d5d" font-size="21" font-weight="600" text-anchor="middle">±0</text><rect x="35" y="113" width="235" height="47" rx="10" fill="#d9eee4" stroke="#dee7df" stroke-width="1.5"/><text x="152" y="143" fill="#203035" font-size="19" font-weight="600" text-anchor="middle">阶码全零</text><rect x="285" y="113" width="240" height="47" rx="10" fill="#f7f8f5" stroke="#dee7df" stroke-width="1.5"/><text x="405" y="143" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">小数字段非零</text><rect x="539" y="113" width="300" height="47" rx="10" fill="#d9eee4" stroke="#dee7df" stroke-width="1.5"/><text x="689" y="143" fill="#215d5d" font-size="21" font-weight="600" text-anchor="middle">次正规数</text><rect x="35" y="173" width="235" height="47" rx="10" fill="#e3eff3" stroke="#dee7df" stroke-width="1.5"/><text x="152" y="203" fill="#203035" font-size="19" font-weight="600" text-anchor="middle">阶码在两端之间</text><rect x="285" y="173" width="240" height="47" rx="10" fill="#f7f8f5" stroke="#dee7df" stroke-width="1.5"/><text x="405" y="203" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">任意</text><rect x="539" y="173" width="300" height="47" rx="10" fill="#e3eff3" stroke="#dee7df" stroke-width="1.5"/><text x="689" y="203" fill="#215d5d" font-size="21" font-weight="600" text-anchor="middle">正规格化数</text><rect x="35" y="233" width="235" height="47" rx="10" fill="#eee3f7" stroke="#dee7df" stroke-width="1.5"/><text x="152" y="263" fill="#203035" font-size="19" font-weight="600" text-anchor="middle">阶码全一</text><rect x="285" y="233" width="240" height="47" rx="10" fill="#f7f8f5" stroke="#dee7df" stroke-width="1.5"/><text x="405" y="263" fill="#203035" font-size="18" font-weight="600" text-anchor="middle">零 / 非零</text><rect x="539" y="233" width="300" height="47" rx="10" fill="#eee3f7" stroke="#dee7df" stroke-width="1.5"/><text x="689" y="263" fill="#215d5d" font-size="21" font-weight="600" text-anchor="middle">±∞ / NaN</text></svg>