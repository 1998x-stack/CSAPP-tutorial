<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" role="img" aria-labelledby="t desc"><title id="t">长度前缀协议：先读满四字节，再读满正文</title><desc id="desc">应用记录编码为4字节网络字节序长度5，后接 HELLO 共9字节。演示读取碎片为00 00、00 05 H、ELLO；接收端先补齐长度字段再累积五字节消息体。</desc><rect width="960" height="266" rx="15" fill="#f8fbf8"/><text x="25" y="37" font-size="21" font-weight="700" fill="#254b47">长度前缀协议：先读满四字节，再读满正文</text><rect x="24" y="64" width="285" height="133" rx="11" fill="#e6f3ee" stroke="#116d65" stroke-width="1.5"/><text x="38" y="91" font-size="14" font-weight="700" fill="#116d65">协议写入</text><text x="38" y="130" font-size="18" font-weight="700" fill="#23423c">00 00 00 05 HELLO</text><text x="38" y="164" font-size="14" fill="#526760">4 B 长度 + 5 B 正文</text><path d="M314 127 h19" stroke="#387c73" stroke-width="2.3"/><path d="M325 121 l7 6 -7 6" fill="none" stroke="#387c73" stroke-width="2"/><rect x="336" y="64" width="285" height="133" rx="11" fill="#fff0e4" stroke="#a76539" stroke-width="1.5"/><text x="350" y="91" font-size="14" font-weight="700" fill="#a76539">接收片段</text><text x="350" y="130" font-size="18" font-weight="700" fill="#23423c">00 00 | 00 05 H | ELLO</text><text x="350" y="164" font-size="14" fill="#526760">读取边界任意</text><path d="M626 127 h19" stroke="#387c73" stroke-width="2.3"/><path d="M637 121 l7 6 -7 6" fill="none" stroke="#387c73" stroke-width="2"/><rect x="648" y="64" width="285" height="133" rx="11" fill="#eeebfa" stroke="#6152a0" stroke-width="1.5"/><text x="662" y="91" font-size="14" font-weight="700" fill="#6152a0">状态机</text><text x="662" y="130" font-size="18" font-weight="700" fill="#23423c">header 4 → body 5</text><text x="662" y="164" font-size="14" fill="#526760">累积到 9 B 才完成</text><rect x="24" y="213" width="911" height="37" rx="8" fill="#e2efe7"/><text x="38" y="237" font-size="14.5" font-weight="600" fill="#295c54">一条逻辑消息 ≠ 一次 send ≠ 一次 recv；记录边界属于应用协议，不属于 TCP</text></svg>