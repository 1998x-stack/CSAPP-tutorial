<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">call 前后，栈指针为何相差 8 模 16？</title><desc id="figure-desc">调用点: rsp % 16 = 0: 调用者准备好对齐; 执行 CALL: rsp ← rsp − 8: 压入 8B 返回地址; 函数入口: rsp % 16 = 8: 可按需调整栈帧</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#254744">栈对齐与返回地址</text><rect x="24" y="65" width="284" height="128" rx="12" stroke="#126b67" fill="#e5f2ed"/><text x="39" y="91" font-size="14" font-weight="750" fill="#126b67">调用点</text><text x="39" y="127" font-size="19" font-weight="700" fill="#24413e">rsp % 16 = 0</text><text x="39" y="165" font-size="15" fill="#526a63">调用者准备好对齐</text><path d="M311 127 H330" stroke="#4c7a73" stroke-width="2.5"/><path d="M324 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="333" y="65" width="284" height="128" rx="12" stroke="#ac673d" fill="#fff1e4"/><text x="348" y="91" font-size="14" font-weight="750" fill="#ac673d">执行 CALL</text><text x="348" y="127" font-size="19" font-weight="700" fill="#24413e">rsp ← rsp − 8</text><text x="348" y="165" font-size="15" fill="#526a63">压入 8B 返回地址</text><path d="M620 127 H639" stroke="#4c7a73" stroke-width="2.5"/><path d="M633 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="642" y="65" width="284" height="128" rx="12" stroke="#6655a7" fill="#eeeafa"/><text x="657" y="91" font-size="14" font-weight="750" fill="#6655a7">函数入口</text><text x="657" y="127" font-size="19" font-weight="700" fill="#24413e">rsp % 16 = 8</text><text x="657" y="165" font-size="15" fill="#526a63">可按需调整栈帧</text><rect x="25" y="211" width="910" height="35" rx="7" fill="#e4eee8"/><text x="42" y="235" font-size="15" fill="#245e57">示意：0x1000 → CALL → 0x0ff8；真实序言由编译器决定</text></svg>