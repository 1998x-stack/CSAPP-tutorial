<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="movlea-title movlea-desc"><title id="movlea-title">MOV与LEA对比</title><desc id="movlea-desc">MOV读出内存的值42，LEA只把地址0x1008写入寄存器</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="31" fill="#203035" font-size="23" font-weight="600" text-anchor="middle">同一地址表达式，两种截然不同的输出</text><rect x="310" y="58" width="260" height="68" rx="10" fill="#e5eee8" stroke="#dee7df" stroke-width="1.5"/><text x="440" y="84" fill="#203035" font-size="20" font-weight="600" text-anchor="middle">地址 0x1008</text><text x="440" y="114" fill="#ad6b46" font-size="18" font-weight="600" text-anchor="middle">内存内容：42</text><path d="M350 127 L226 177" fill="none" stroke="#147f80" stroke-width="3"/><path d="M530 127 L662 177" fill="none" stroke="#c76646" stroke-width="3"/><rect x="36" y="185" width="374" height="82" rx="10" fill="#dceee6" stroke="#dee7df" stroke-width="1.5"/><text x="224" y="218" fill="#116c6b" font-size="20" font-weight="600" text-anchor="middle">movq 8(%rdi), %rax</text><text x="224" y="249" fill="#203035" font-size="19" font-weight="600" text-anchor="middle">结果：42（读取内存）</text><rect x="470" y="185" width="374" height="82" rx="10" fill="#f3e1d8" stroke="#dee7df" stroke-width="1.5"/><text x="657" y="218" fill="#a75e40" font-size="20" font-weight="600" text-anchor="middle">leaq 8(%rdi), %rax</text><text x="657" y="249" fill="#203035" font-size="19" font-weight="600" text-anchor="middle">结果：0x1008（只算地址）</text><text x="440" y="299" fill="#5e7373" font-size="17" font-weight="600" text-anchor="middle">前提：%rdi = 0x1000；地址 0x1008 存有一个 64 位值 42</text></svg>