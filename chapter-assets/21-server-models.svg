<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 285" role="img" aria-labelledby="t d"><title id="t">迭代、多进程与事件驱动服务模型对照</title><desc id="d">迭代处理在客户端 A 阻塞时拖延客户端 B，多进程与事件循环均可让 B 获得进展。</desc><rect width="920" height="285" rx="18" fill="#f6f8f5"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#294c4e"><text x="155" y="37" font-size="20">迭代：串行等待</text><text x="465" y="37" font-size="20">多进程：分离</text><text x="767" y="37" font-size="20">事件循环：就绪驱动</text></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="19"><rect x="40" y="67" width="225" height="58" rx="10" fill="#f5ded9" stroke="#c76646"/><rect x="40" y="151" width="225" height="58" rx="10" fill="#f4ebe4" stroke="#c76646"/><text x="152" y="104" fill="#7e402f">A：阻塞中</text><text x="152" y="188" fill="#7e402f">B：排队</text><rect x="350" y="67" width="225" height="58" rx="10" fill="#e9e3fb" stroke="#7461ba"/><rect x="350" y="151" width="225" height="58" rx="10" fill="#e9e3fb" stroke="#7461ba"/><text x="463" y="104" fill="#52417c">子进程 A：等待</text><text x="463" y="188" fill="#52417c">子进程 B：处理</text><rect x="655" y="67" width="225" height="58" rx="10" fill="#d8efea" stroke="#147f80"/><rect x="655" y="151" width="225" height="58" rx="10" fill="#d8efea" stroke="#147f80"/><text x="768" y="104" fill="#236364">A：暂不就绪</text><text x="768" y="188" fill="#236364">B：可读，处理</text></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#667d7b"><text x="152" y="252">B 被 A 的等待拖住</text><text x="463" y="252">隔离但有进程开销</text><text x="768" y="252">需要维护每连接状态</text></g></svg>