<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="twos-title twos-desc"><title id="twos-title">补码最高位负权重</title><desc id="twos-desc">8位补码位模式11111111求值为负一；无符号求值为255</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="34" fill="#203035" font-size="24" font-weight="600" text-anchor="middle">8 位补码：最高位是负权重</text><rect x="31" y="71" width="93" height="92" rx="10" fill="#f6d9cf" stroke="#cc9786" stroke-width="1.5"/><text x="77" y="105" fill="#a85336" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="77" y="142" fill="#a85336" font-size="19" font-weight="600" text-anchor="middle">−128</text><rect x="134" y="71" width="93" height="92" rx="10" fill="#d9ece4" stroke="#9dc9b8" stroke-width="1.5"/><text x="180" y="105" fill="#16695f" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="180" y="142" fill="#16695f" font-size="19" font-weight="600" text-anchor="middle">+64</text><rect x="237" y="71" width="93" height="92" rx="10" fill="#d9ece4" stroke="#9dc9b8" stroke-width="1.5"/><text x="283" y="105" fill="#16695f" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="283" y="142" fill="#16695f" font-size="19" font-weight="600" text-anchor="middle">+32</text><rect x="340" y="71" width="93" height="92" rx="10" fill="#d9ece4" stroke="#9dc9b8" stroke-width="1.5"/><text x="386" y="105" fill="#16695f" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="386" y="142" fill="#16695f" font-size="19" font-weight="600" text-anchor="middle">+16</text><rect x="443" y="71" width="93" height="92" rx="10" fill="#d9ece4" stroke="#9dc9b8" stroke-width="1.5"/><text x="489" y="105" fill="#16695f" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="489" y="142" fill="#16695f" font-size="19" font-weight="600" text-anchor="middle">+8</text><rect x="546" y="71" width="93" height="92" rx="10" fill="#d9ece4" stroke="#9dc9b8" stroke-width="1.5"/><text x="592" y="105" fill="#16695f" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="592" y="142" fill="#16695f" font-size="19" font-weight="600" text-anchor="middle">+4</text><rect x="649" y="71" width="93" height="92" rx="10" fill="#d9ece4" stroke="#9dc9b8" stroke-width="1.5"/><text x="695" y="105" fill="#16695f" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="695" y="142" fill="#16695f" font-size="19" font-weight="600" text-anchor="middle">+2</text><rect x="752" y="71" width="93" height="92" rx="10" fill="#d9ece4" stroke="#9dc9b8" stroke-width="1.5"/><text x="798" y="105" fill="#16695f" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="798" y="142" fill="#16695f" font-size="19" font-weight="600" text-anchor="middle">+1</text><text x="440" y="203" fill="#253f40" font-size="28" font-weight="600" text-anchor="middle">11111111₂</text><text x="440" y="242" fill="#5c6565" font-size="22" font-weight="600" text-anchor="middle">−128 + 64 + 32 + 16 + 8 + 4 + 2 + 1 = −1</text><text x="440" y="281" fill="#896d39" font-size="20" font-weight="600" text-anchor="middle">同一位串若按无符号解释：255</text></svg>