<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="s18a-title s18a-desc"><title id="s18a-title">用户分配器与内核的层次</title><desc id="s18a-desc">malloc先在分配器管理的空闲块中寻找可用块，必要时才向内核扩展映射</desc><rect width="880" height="300" fill="#fbfcf8"/><text x="440" y="32" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">malloc 并不等于系统调用</text><rect x="24" y="79" width="242" height="125" rx="10" fill="#e2f0e7" stroke="#c9d9d0" stroke-width="1.6"/><text x="145" y="120" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">应用</text><text x="145" y="158" fill="#52676a" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">malloc(100)</text><rect x="318" y="79" width="242" height="125" rx="10" fill="#eee8f4" stroke="#c9d9d0" stroke-width="1.6"/><text x="439" y="120" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">用户态分配器</text><text x="439" y="158" fill="#52676a" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">查找 / 分割 / 空闲块复用</text><rect x="614" y="79" width="242" height="125" rx="10" fill="#f7e5d9" stroke="#c9d9d0" stroke-width="1.6"/><text x="735" y="120" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600" text-anchor="middle">内核虚拟内存</text><text x="735" y="158" fill="#52676a" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">brk / mmap 等接口</text><path d="M267,141 L313,141" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M313 141 L303.3465918192059 146.27368092464624 M313 141 L303.3465918192059 135.72631907535376" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M559,141 L609,141" fill="none" stroke="#bf7c5c" stroke-width="3" stroke-linecap="round"/><path d="M609 141 L599.3465918192059 146.27368092464624 M609 141 L599.3465918192059 135.72631907535376" fill="none" stroke="#bf7c5c" stroke-width="3" stroke-linecap="round"/><text x="440" y="251" fill="#526b66" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">大量小请求可能由分配器直接满足；空间不足才需要向系统请求更多</text><text x="440" y="283" fill="#526b66" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="600" text-anchor="middle">free(p) 通常先把块交还分配器，不承诺立刻减少 RSS</text></svg>