<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 264" aria-labelledby="fig-title fig-desc"><title id="fig-title">4 × 9 位索引 + 12 位偏移的可核对字段</title><desc id="fig-desc">示例虚拟地址 0x00007f123456789a，48位规范地址中 PML4 索引254、PDPT 索引72、PD 索引418、PT 索引359，页内偏移0x89a；假设页表将其映射到页框0x2a7则物理地址0x2a789a。</desc><rect width="960" height="264" rx="15" fill="#f8faf7"/><text x="24" y="36" font-size="20" font-weight="700" fill="#254943">VA 0x00007f123456789a：四级页表索引拆解</text><rect x="23" y="68" width="168" height="106" rx="9" fill="#dcefeb" stroke="#a4c7bd"/><text x="36" y="99" font-size="16" font-weight="700" fill="#244b45">PML4</text><text x="36" y="126" font-size="14" fill="#567269">9 位</text><text x="36" y="154" font-size="22" font-weight="700" fill="#24564d">254</text><rect x="197" y="68" width="168" height="106" rx="9" fill="#e6eef9" stroke="#a4c7bd"/><text x="210" y="99" font-size="16" font-weight="700" fill="#244b45">PDPT</text><text x="210" y="126" font-size="14" fill="#567269">9 位</text><text x="210" y="154" font-size="22" font-weight="700" fill="#24564d">72</text><rect x="371" y="68" width="168" height="106" rx="9" fill="#eee8f6" stroke="#a4c7bd"/><text x="384" y="99" font-size="16" font-weight="700" fill="#244b45">PD</text><text x="384" y="126" font-size="14" fill="#567269">9 位</text><text x="384" y="154" font-size="22" font-weight="700" fill="#24564d">418</text><rect x="545" y="68" width="168" height="106" rx="9" fill="#f6e7df" stroke="#a4c7bd"/><text x="558" y="99" font-size="16" font-weight="700" fill="#244b45">PT</text><text x="558" y="126" font-size="14" fill="#567269">9 位</text><text x="558" y="154" font-size="22" font-weight="700" fill="#24564d">359</text><rect x="719" y="68" width="216" height="106" rx="9" fill="#dff0e5" stroke="#a4c7bd"/><text x="732" y="99" font-size="16" font-weight="700" fill="#244b45">offset</text><text x="732" y="126" font-size="14" fill="#567269">12 位</text><text x="732" y="154" font-size="22" font-weight="700" fill="#24564d">0x89a</text><path d="M480 183 V202" stroke="#337e74" stroke-width="2.5"/><rect x="24" y="208" width="912" height="36" rx="8" fill="#e3f0e7"/><text x="40" y="232" font-size="15" font-weight="700" fill="#2d6054">仅给定页框 0x2a7 时：PA = (PPN × 4096) + offset = 0x2a789a</text></svg>