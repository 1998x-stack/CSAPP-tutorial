<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" role="img" aria-labelledby="t desc"><title id="t">就绪是许可尝试，不是完成保证</title><desc id="desc">管道写端关闭后，poll 显示读端有事件可处理，read 返回0表示 EOF。网络 socket 场景还需要处理就绪之后的 EAGAIN、正数短读、半关闭和缓冲区状态。</desc><rect width="960" height="266" rx="15" fill="#f8fbf8"/><text x="25" y="37" font-size="21" font-weight="700" fill="#254b47">就绪是许可尝试，不是完成保证</text><rect x="24" y="64" width="285" height="133" rx="11" fill="#e6f3ee" stroke="#116d65" stroke-width="1.5"/><text x="38" y="91" font-size="14" font-weight="700" fill="#116d65">监听可读事件</text><text x="38" y="130" font-size="18" font-weight="700" fill="#23423c">poll → revents</text><text x="38" y="164" font-size="14" fill="#526760">EOF 也可能被报告</text><path d="M314 127 h19" stroke="#387c73" stroke-width="2.3"/><path d="M325 121 l7 6 -7 6" fill="none" stroke="#387c73" stroke-width="2"/><rect x="336" y="64" width="285" height="133" rx="11" fill="#fff0e4" stroke="#a76539" stroke-width="1.5"/><text x="350" y="91" font-size="14" font-weight="700" fill="#a76539">尝试执行</text><text x="350" y="130" font-size="18" font-weight="700" fill="#23423c">read → 0</text><text x="350" y="164" font-size="14" fill="#526760">对端写侧已关闭并无剩余数据</text><path d="M626 127 h19" stroke="#387c73" stroke-width="2.3"/><path d="M637 121 l7 6 -7 6" fill="none" stroke="#387c73" stroke-width="2"/><rect x="648" y="64" width="285" height="133" rx="11" fill="#eeebfa" stroke="#6152a0" stroke-width="1.5"/><text x="662" y="91" font-size="14" font-weight="700" fill="#6152a0">状态转移</text><text x="662" y="130" font-size="18" font-weight="700" fill="#23423c">READ → EOF → CLOSE</text><text x="662" y="164" font-size="14" fill="#526760">清理 fd 与记录状态</text><rect x="24" y="213" width="911" height="37" rx="8" fill="#e2efe7"/><text x="38" y="237" font-size="14.5" font-weight="600" fill="#295c54">ready ≠ full message；一次读可能返回数据、零、EAGAIN 或错误</text></svg>