<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="s18f-title s18f-desc"><title id="s18f-title">外部碎片的固定池示例</title><desc id="s18f-desc">三块空闲内存加起来160字节，却被已分配块隔开，最大连续块只有64字节</desc><rect width="880" height="300" fill="#fbfcf8"/><text x="440" y="31" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">总空闲 160 B ≠ 最大连续空闲 160 B</text><rect x="28" y="93" width="217" height="105" rx="5" fill="#d5ece0" stroke="#a8cbbb" stroke-width="1.6"/><text x="136.5" y="151" fill="#1c7066" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle">空闲 64 B</text><rect x="250" y="93" width="85" height="105" rx="5" fill="#edd5c7" stroke="#d5aa94" stroke-width="1.6"/><text x="292.5" y="151" fill="#975e47" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle">已分配</text><rect x="340" y="93" width="144" height="105" rx="5" fill="#d5ece0" stroke="#a8cbbb" stroke-width="1.6"/><text x="412" y="151" fill="#1c7066" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle">空闲 32 B</text><rect x="489" y="93" width="85" height="105" rx="5" fill="#edd5c7" stroke="#d5aa94" stroke-width="1.6"/><text x="531.5" y="151" fill="#975e47" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle">已分配</text><rect x="579" y="93" width="217" height="105" rx="5" fill="#d5ece0" stroke="#a8cbbb" stroke-width="1.6"/><text x="687.5" y="151" fill="#1c7066" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="600" text-anchor="middle">空闲 64 B</text><text x="440" y="235" fill="#9c6243" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" text-anchor="middle">请求 96 B → 这个固定池中没有单个 96 B 空闲块</text><text x="440" y="276" fill="#607472" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">现实 malloc 可能再申请新区域，所以此图不声称 malloc 必然失败</text></svg>