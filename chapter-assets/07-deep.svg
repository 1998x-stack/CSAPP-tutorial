<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">三个字段共 6 字节，为什么结构体可能占 12 字节？</title><desc id="figure-desc">字段 0: kind: 1 B: 偏移 0; 内部填充: 3 B padding: 使 int 从偏移 4 开始; 剩余字段: count: 4 B · enabled: 1 B: 尾部再填充 3 B</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#254744">结构体的实际字节地图</text><rect x="24" y="65" width="284" height="128" rx="12" stroke="#126b67" fill="#e5f2ed"/><text x="39" y="91" font-size="14" font-weight="750" fill="#126b67">字段 0</text><text x="39" y="127" font-size="19" font-weight="700" fill="#24413e">kind: 1 B</text><text x="39" y="165" font-size="15" fill="#526a63">偏移 0</text><path d="M311 127 H330" stroke="#4c7a73" stroke-width="2.5"/><path d="M324 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="333" y="65" width="284" height="128" rx="12" stroke="#ac673d" fill="#fff1e4"/><text x="348" y="91" font-size="14" font-weight="750" fill="#ac673d">内部填充</text><text x="348" y="127" font-size="19" font-weight="700" fill="#24413e">3 B padding</text><text x="348" y="165" font-size="15" fill="#526a63">使 int 从偏移 4 开始</text><path d="M620 127 H639" stroke="#4c7a73" stroke-width="2.5"/><path d="M633 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="642" y="65" width="284" height="128" rx="12" stroke="#6655a7" fill="#eeeafa"/><text x="657" y="91" font-size="14" font-weight="750" fill="#6655a7">剩余字段</text><text x="657" y="127" font-size="19" font-weight="700" fill="#24413e">count: 4 B · enabled: 1 B</text><text x="657" y="165" font-size="15" fill="#526a63">尾部再填充 3 B</text><rect x="25" y="211" width="910" height="35" rx="7" fill="#e4eee8"/><text x="42" y="235" font-size="15" fill="#245e57">常见 int 4 字节且对齐 4：偏移 0、4、8，sizeof=12</text></svg>