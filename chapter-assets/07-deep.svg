<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 264"><title id="title">结构体 Record 十二字节布局</title><desc id="desc">字节 0 为 kind，字节 1 至 3 为内部填充，字节 4 至 7 为 count，字节 8 为 enabled，字节 9 至 11 为尾部填充；假设 int 大小和对齐都是四字节。</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="36" font-size="21" font-weight="700" fill="#234b43">从成员定义推到 12 字节对象表示</text><text x="28" y="63" font-size="14" fill="#536b63">char kind · int count · char enabled（假设 int 4B，alignof(int)=4）</text><rect x="28" y="94" width="70" height="78" rx="6" fill="#d8f0e4" stroke="#328979"/><text x="63" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">0</text><text x="63" y="148" font-size="11" fill="#26443f" text-anchor="middle">kind</text><rect x="103" y="94" width="70" height="78" rx="6" fill="#ffe9d7" stroke="#be7d4d"/><text x="138" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">1</text><text x="138" y="148" font-size="10" fill="#26443f" text-anchor="middle">padding</text><rect x="178" y="94" width="70" height="78" rx="6" fill="#ffe9d7" stroke="#be7d4d"/><text x="213" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">2</text><text x="213" y="148" font-size="10" fill="#26443f" text-anchor="middle">padding</text><rect x="253" y="94" width="70" height="78" rx="6" fill="#ffe9d7" stroke="#be7d4d"/><text x="288" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">3</text><text x="288" y="148" font-size="10" fill="#26443f" text-anchor="middle">padding</text><rect x="328" y="94" width="70" height="78" rx="6" fill="#dce8fb" stroke="#416eaa"/><text x="363" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">4</text><text x="363" y="148" font-size="11" fill="#26443f" text-anchor="middle">count</text><rect x="403" y="94" width="70" height="78" rx="6" fill="#dce8fb" stroke="#416eaa"/><text x="438" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">5</text><text x="438" y="148" font-size="11" fill="#26443f" text-anchor="middle">count</text><rect x="478" y="94" width="70" height="78" rx="6" fill="#dce8fb" stroke="#416eaa"/><text x="513" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">6</text><text x="513" y="148" font-size="11" fill="#26443f" text-anchor="middle">count</text><rect x="553" y="94" width="70" height="78" rx="6" fill="#dce8fb" stroke="#416eaa"/><text x="588" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">7</text><text x="588" y="148" font-size="11" fill="#26443f" text-anchor="middle">count</text><rect x="628" y="94" width="70" height="78" rx="6" fill="#d8f0e4" stroke="#328979"/><text x="663" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">8</text><text x="663" y="148" font-size="11" fill="#26443f" text-anchor="middle">enabled</text><rect x="703" y="94" width="70" height="78" rx="6" fill="#ffe9d7" stroke="#be7d4d"/><text x="738" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">9</text><text x="738" y="148" font-size="10" fill="#26443f" text-anchor="middle">padding</text><rect x="778" y="94" width="70" height="78" rx="6" fill="#ffe9d7" stroke="#be7d4d"/><text x="813" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">10</text><text x="813" y="148" font-size="10" fill="#26443f" text-anchor="middle">padding</text><rect x="853" y="94" width="70" height="78" rx="6" fill="#ffe9d7" stroke="#be7d4d"/><text x="888" y="116" font-size="14" fill="#415b56" font-weight="700" text-anchor="middle">11</text><text x="888" y="148" font-size="10" fill="#26443f" text-anchor="middle">padding</text><path d="M328 183 V197 H622 V183" fill="none" stroke="#416eaa" stroke-width="2"/><text x="475" y="218" font-size="15" fill="#365f8f" text-anchor="middle">count 需要从偏移 4 开始</text><text x="27" y="244" font-size="14" fill="#536b63">0–8 是有效成员所占位置；红色格为填充字节，值不可作为稳定协议读取</text></svg>