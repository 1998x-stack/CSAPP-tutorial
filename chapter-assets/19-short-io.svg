<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" role="img" aria-labelledby="t d"><title id="t">短读写的分段返回</title><desc id="d">读取八字节时，第一次返回三个，第二次返回五，缓冲起点每次向前移动。</desc><rect width="920" height="250" rx="18" fill="#f6f8f5"/><g font-family="Arial,sans-serif" fill="#284448" font-size="20"><text x="42" y="48">请求读取 8 字节</text><text x="42" y="115">第一次 read 返回 3</text><text x="42" y="183">第二次 read 返回 5</text></g><g stroke="#fff" stroke-width="2"><rect x="364" y="22" width="64" height="47" fill="#147f80"/><rect x="428" y="22" width="64" height="47" fill="#147f80"/><rect x="492" y="22" width="64" height="47" fill="#147f80"/><rect x="556" y="22" width="64" height="47" fill="#c76646"/><rect x="620" y="22" width="64" height="47" fill="#c76646"/><rect x="684" y="22" width="64" height="47" fill="#c76646"/><rect x="748" y="22" width="64" height="47" fill="#c76646"/><rect x="812" y="22" width="64" height="47" fill="#c76646"/><rect x="364" y="90" width="192" height="47" rx="6" fill="#147f80"/><rect x="556" y="158" width="320" height="47" rx="6" fill="#c76646"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#fff" text-anchor="middle"><text x="460" y="120">3 字节</text><text x="716" y="188">5 字节</text></g><g font-family="Arial,sans-serif" font-size="15" fill="#5c6f70"><text x="364" y="236">buf[0..2]</text><text x="690" y="236">buf[3..7]</text></g></svg>