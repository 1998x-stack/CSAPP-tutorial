<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 304" role="img" aria-labelledby="t d"><title id="t">TCP 客户端与服务端的建连流程</title><desc id="d">服务端创建监听 fd；客户端连接后，服务端的 accept 产生新的已连接 fd，两个 fd 承担不同职责。</desc><rect width="920" height="304" rx="18" fill="#f6f8f5"/><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#284448"><text x="235" y="40">服务端</text><text x="685" y="40">客户端</text></g><g font-family="Arial,sans-serif" font-size="19" text-anchor="middle"><rect x="95" y="59" width="278" height="54" rx="10" fill="#d9eeeb" stroke="#147f80"/><text x="234" y="91" fill="#174d50">socket → bind → listen</text><rect x="95" y="141" width="278" height="56" rx="10" fill="#d9eeeb" stroke="#147f80"/><text x="234" y="175" fill="#174d50">accept → connfd</text><rect x="565" y="59" width="245" height="54" rx="10" fill="#eae4f8" stroke="#7461ba"/><text x="687" y="91" fill="#493d7c">socket → connect</text><rect x="565" y="141" width="245" height="56" rx="10" fill="#eae4f8" stroke="#7461ba"/><text x="687" y="175" fill="#493d7c">send / recv</text></g><g stroke="#7e789f" stroke-width="3" fill="none"><path d="M565 94 L373 167"/><path d="M373 169 L565 169" stroke-dasharray="6 8"/></g><g font-family="Arial,sans-serif" font-size="18" fill="#486366" text-anchor="middle"><text x="460" y="236">监听 fd 继续接受新连接</text><text x="460" y="266">connfd 与客户端 socket 交换字节</text></g></svg>