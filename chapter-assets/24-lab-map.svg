<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" role="img" aria-labelledby="t d">
<title id="t">Data、Bomb 和 Attack 三个实验的学习路线</title><desc id="d">Data Lab 从比特到表达式，Bomb Lab 从机器指令到程序逻辑，Attack Lab 从边界检查到控制流防护。三个模块递进，但不提供通用漏洞利用操作。</desc>
<rect width="940" height="310" rx="16" fill="#f8f9f4"/>
<g font-size="18" text-anchor="middle"><rect x="24" y="44" width="270" height="195" rx="13" fill="#e0f2eb" stroke="#81c0a4"/><text x="159" y="87" font-size="23" font-weight="700" fill="#146e63">Data Lab</text><text x="159" y="126" fill="#2f5e56">一串位如何变成值？</text><text x="159" y="168" fill="#426b62">布尔代数 · 补码</text><text x="159" y="199" fill="#426b62">规则约束与测试</text><rect x="336" y="44" width="270" height="195" rx="13" fill="#e7eef8" stroke="#a4b7d4"/><text x="471" y="87" font-size="23" font-weight="700" fill="#355e86">Bomb Lab</text><text x="471" y="126" fill="#41627f">指令如何表达分支？</text><text x="471" y="168" fill="#506c87">反汇编 · 调试器</text><text x="471" y="199" fill="#506c87">假设—证据—验证</text><rect x="648" y="44" width="268" height="195" rx="13" fill="#faede7" stroke="#d6a78b"/><text x="782" y="87" font-size="23" font-weight="700" fill="#a95d3c">Attack Lab</text><text x="782" y="126" fill="#9b654c">越界为何改变执行？</text><text x="782" y="168" fill="#9b654c">栈布局 · 控制流</text><text x="782" y="199" fill="#9b654c">隔离实验与防护</text></g>
<text x="29" y="278" font-size="17" fill="#496862">先理解语义，再观察机器行为，最后理解为什么要建立安全边界。</text></svg>