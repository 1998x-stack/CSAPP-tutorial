<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 315" role="img" aria-labelledby="t d">
<title id="t">线程池把短任务排入有界队列，交给长期存在的工作线程</title><desc id="d">左侧请求依次入队，队列由互斥锁和条件变量协调，工作线程在锁外执行任务。关闭时停止接收新任务，清空队列后回收线程。</desc>
<rect width="940" height="315" rx="16" fill="#f8f9f4"/><text x="30" y="40" font-size="21" fill="#244e4b" font-weight="700">请求与线程生命周期解耦</text>
<g text-anchor="middle" font-size="18"><rect x="29" y="90" width="150" height="112" rx="10" fill="#eaf2f7" stroke="#9dbbcd"/><text x="104" y="128" fill="#345f79">请求</text><text x="104" y="157" fill="#345f79">生产者</text><rect x="248" y="90" width="324" height="112" rx="10" fill="#e0f1e9" stroke="#87b9a5"/><text x="410" y="122" fill="#146b62" font-weight="700">任务队列</text><text x="410" y="153" fill="#265d56" font-size="16">入队 / 出队：短临界区</text><text x="410" y="179" fill="#265d56" font-size="16">空时等待 · 满时背压</text><rect x="656" y="64" width="258" height="62" rx="9" fill="#efedfa" stroke="#a89bd7"/><text x="785" y="101" fill="#66549a">工作线程 1</text><rect x="656" y="138" width="258" height="62" rx="9" fill="#efedfa" stroke="#a89bd7"/><text x="785" y="175" fill="#66549a">工作线程 2</text><rect x="656" y="212" width="258" height="62" rx="9" fill="#efedfa" stroke="#a89bd7"/><text x="785" y="249" fill="#66549a">工作线程 N</text></g>
<g stroke="#c76646" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M179 145 H240 l-9 -7 m9 7 -9 7"/><path d="M572 145 H615 V95 H649 l-9 -7 m9 7 -9 7"/><path d="M615 169 H649 l-9 -7 m9 7 -9 7"/><path d="M615 169 V244 H649 l-9 -7 m9 7 -9 7"/></g>
<text x="30" y="285" font-size="16" fill="#516c65">关键不变量：锁只保护队列状态；耗时任务必须在解锁后执行。</text></svg>