<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" role="img" aria-labelledby="title desc"><title id="title">互斥锁将整个读—改—写组合成临界区</title><desc id="desc">无锁的两个读取先后写入示意可能丢失一次逻辑更新，但在 C 里非原子共享变量的数据竞争属于未定义行为。使用同一互斥锁包围整个计数器更新，四线程各10000次最终必为40000。</desc><rect width="960" height="266" rx="15" fill="#f8fbf7"/><text x="24" y="35" font-size="20" font-weight="700" fill="#254b46">共享计数器：示意交错 vs 有锁更新</text><rect x="24" y="64" width="441" height="169" rx="11" fill="#f7e4d8" stroke="#b8cec0"/><text x="38" y="90" font-size="18" font-weight="700" fill="#264d44">不加同步的概念交错</text><rect x="38" y="101" width="414" height="35" rx="6" fill="white"/><text x="49" y="125" font-size="14" fill="#264b42">A: read(7)  → 待写 8</text><rect x="38" y="143" width="414" height="35" rx="6" fill="white"/><text x="49" y="167" font-size="14" fill="#264b42">B: read(7)  → 待写 8</text><rect x="38" y="185" width="414" height="35" rx="6" fill="white"/><text x="49" y="209" font-size="14" fill="#264b42">A/B: write(8)  → 逻辑更新丢失</text><rect x="494" y="64" width="441" height="169" rx="11" fill="#e1f1e7" stroke="#b8cec0"/><text x="508" y="90" font-size="18" font-weight="700" fill="#264d44">同一把 mutex 保护更新</text><rect x="508" y="101" width="414" height="35" rx="6" fill="white"/><text x="519" y="125" font-size="14" fill="#264b42">A: lock → read/write(8) → unlock</text><rect x="508" y="143" width="414" height="35" rx="6" fill="white"/><text x="519" y="167" font-size="14" fill="#264b42">B: lock → read/write(9) → unlock</text><rect x="508" y="185" width="414" height="35" rx="6" fill="white"/><text x="519" y="209" font-size="14" fill="#264b42">四线程各 10,000 次 → 40,000</text><text x="24" y="255" font-size="13" fill="#57726a">注意：无锁路径仅解释逻辑危险；真实普通 C 变量数据竞争属于未定义行为</text></svg>