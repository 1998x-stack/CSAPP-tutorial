<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="d14b-t d14b-d">
<title id="d14b-t">一个 GOT 表中四类重定位槽的写入值对比</title>
<desc id="d14b-d">GOT 表相邻四项：RELATIVE 槽写入 B+A，例如装载基址 0x70000000 加加数 0x1230 得到 0x70001230，指向库内对象；GLOB_DAT 槽写入符号查找得到的全局数据地址 0x72100000；JUMP_SLOT 槽写入外部函数地址；IRELATIVE 槽先调用 IFUNC 解析函数得到实现地址。只有 RELATIVE 是简单的 B+A。</desc>
<rect x="0" y="0" width="960" height="264" fill="#fbfaf7"/>
<text x="20" y="30" font-size="17" font-weight="700" fill="#203b41">GOT 槽不是同一个公式</text>
<g font-size="13">
<rect x="24" y="52" width="216" height="164" rx="12" fill="#e8f3f0" stroke="#97c6bf"/>
<text x="40" y="78" font-size="15" font-weight="700" fill="#1d5b5e">RELATIVE</text>
<text x="40" y="106" fill="#203b41">值 = B + A</text>
<text x="40" y="132" fill="#53676d">0x70000000 + 0x1230</text>
<text x="40" y="158" fill="#53676d">= 0x70001230</text>
<text x="40" y="188" fill="#147f80">库内对象偏移</text>

<rect x="252" y="52" width="216" height="164" rx="12" fill="#fff2e9" stroke="#dcb8a6"/>
<text x="268" y="78" font-size="15" font-weight="700" fill="#955335">GLOB_DAT</text>
<text x="268" y="106" fill="#203b41">值 = S</text>
<text x="268" y="132" fill="#53676d">0x72100000</text>
<text x="268" y="158" fill="#53676d">来自符号查找</text>
<text x="268" y="188" fill="#d06d4d">≠ B + A</text>

<rect x="480" y="52" width="216" height="164" rx="12" fill="#f0edfa" stroke="#b9aedf"/>
<text x="496" y="78" font-size="15" font-weight="700" fill="#5b4d94">JUMP_SLOT</text>
<text x="496" y="106" fill="#203b41">值 = S（函数）</text>
<text x="496" y="132" fill="#53676d">0x72100200</text>
<text x="496" y="158" fill="#53676d">首次调用或 NOW</text>
<text x="496" y="188" fill="#7461ba">PLT 对应项</text>

<rect x="708" y="52" width="228" height="164" rx="12" fill="#eef1f3" stroke="#c3ccd1"/>
<text x="724" y="78" font-size="15" font-weight="700" fill="#3c4a50">IRELATIVE (IFUNC)</text>
<text x="724" y="106" fill="#203b41">值 = resolver(B + A)</text>
<text x="724" y="132" fill="#53676d">先调用解析函数</text>
<text x="724" y="158" fill="#53676d">得到最终实现地址</text>
<text x="724" y="188" fill="#5a666c">额外一步，非简单加法</text>
</g>
<text x="20" y="246" font-size="12.5" fill="#53676d">教学示意：数值为固定算例，B 与 S 并非进程真实映射；类型定义以 System V AMD64 psABI 为准。</text>
</svg>
