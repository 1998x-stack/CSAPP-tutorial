<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" role="img" aria-labelledby="t desc"><title id="t">一次请求七字节，只交付三字节</title><desc id="desc">管道发送端写入 ABC 三字节然后关闭。接收端请求读七字节，实际得到三字节 ABC；第二次读取返回零表示 EOF。读到正数、零、-1 是不同事件。</desc><rect width="960" height="266" rx="15" fill="#f8fbf8"/><text x="25" y="37" font-size="21" font-weight="700" fill="#254b47">一次请求七字节，只交付三字节</text><rect x="24" y="64" width="285" height="133" rx="11" fill="#e6f3ee" stroke="#116d65" stroke-width="1.5"/><text x="38" y="91" font-size="14" font-weight="700" fill="#116d65">写端</text><text x="38" y="130" font-size="18" font-weight="700" fill="#23423c">write(&quot;ABC&quot;, 3)</text><text x="38" y="164" font-size="14" fill="#526760">只向管道放 3B</text><path d="M314 127 h19" stroke="#387c73" stroke-width="2.3"/><path d="M325 121 l7 6 -7 6" fill="none" stroke="#387c73" stroke-width="2"/><rect x="336" y="64" width="285" height="133" rx="11" fill="#fff0e4" stroke="#a76539" stroke-width="1.5"/><text x="350" y="91" font-size="14" font-weight="700" fill="#a76539">读端</text><text x="350" y="130" font-size="18" font-weight="700" fill="#23423c">read(...,7) → 3</text><text x="350" y="164" font-size="14" fill="#526760">只消费已到达 3B</text><path d="M626 127 h19" stroke="#387c73" stroke-width="2.3"/><path d="M637 121 l7 6 -7 6" fill="none" stroke="#387c73" stroke-width="2"/><rect x="648" y="64" width="285" height="133" rx="11" fill="#eeebfa" stroke="#6152a0" stroke-width="1.5"/><text x="662" y="91" font-size="14" font-weight="700" fill="#6152a0">再读取</text><text x="662" y="130" font-size="18" font-weight="700" fill="#23423c">read(...,7) → 0</text><text x="662" y="164" font-size="14" fill="#526760">写端关闭且数据耗尽</text><rect x="24" y="213" width="911" height="37" rx="8" fill="#e2efe7"/><text x="38" y="237" font-size="14.5" font-weight="600" fill="#295c54">短读不是读错；返回值 n>0 只保证本次拿到 n 字节，不能假设完整应用消息</text></svg>