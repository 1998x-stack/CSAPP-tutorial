<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" role="img" aria-labelledby="t d">
<title id="t">读写锁允许多个读者，并使写入独占</title><desc id="d">左边同一时刻两个读取任务可持有读锁，写者等待；右边写者持有写锁时读者与其他写者都等待。这只是互斥关系，不规定等待公平性。</desc>
<rect width="940" height="310" rx="16" fill="#f8f9f4"/>
<rect x="24" y="25" width="428" height="256" rx="12" fill="#fff" stroke="#d8e6de"/><rect x="488" y="25" width="428" height="256" rx="12" fill="#fff" stroke="#d8e6de"/>
<text x="44" y="61" font-size="21" fill="#14736b" font-weight="700">读阶段：读者可以并行</text><text x="508" y="61" font-size="21" fill="#99502f" font-weight="700">写阶段：写者独占</text>
<g font-size="19" text-anchor="middle"><rect x="47" y="86" width="166" height="68" rx="9" fill="#dff1e8" stroke="#76bda3"/><text x="130" y="127" fill="#17685e">读者 A · 读锁</text><rect x="239" y="86" width="186" height="68" rx="9" fill="#dff1e8" stroke="#76bda3"/><text x="332" y="127" fill="#17685e">读者 B · 读锁</text><rect x="510" y="86" width="384" height="68" rx="9" fill="#fff0e4" stroke="#db986b"/><text x="702" y="127" fill="#9c5433">写者 · 写锁</text></g>
<g font-size="18" text-anchor="middle"><rect x="47" y="187" width="378" height="51" rx="8" fill="#f3f2f0" stroke="#d4d4d0" stroke-dasharray="6 4"/><text x="236" y="219" fill="#6d7774">写者在等候</text><rect x="510" y="187" width="384" height="51" rx="8" fill="#f3f2f0" stroke="#d4d4d0" stroke-dasharray="6 4"/><text x="702" y="219" fill="#6d7774">读者和其他写者都在等候</text></g>
<text x="38" y="295" font-size="14" fill="#62736e">并发读不等于一定更快；公平性、临界区长度和实现共同决定收益。</text></svg>