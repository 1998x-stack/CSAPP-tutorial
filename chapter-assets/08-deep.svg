<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">一条存储指令的数据，究竟从哪来、写到哪里？</title><desc id="figure-desc">编码: 40 03 08 ... 00: rA=rax，rB=rbx; 执行: valE = rB + 8: ALU 计算有效地址; 存储: M8[valE] ← valA: valA 来自 rA</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#254744">rmmovq 的编码与数据通路</text><rect x="24" y="65" width="284" height="128" rx="12" stroke="#126b67" fill="#e5f2ed"/><text x="39" y="91" font-size="14" font-weight="750" fill="#126b67">编码</text><text x="39" y="127" font-size="19" font-weight="700" fill="#24413e">40 03 08 ... 00</text><text x="39" y="165" font-size="15" fill="#526a63">rA=rax，rB=rbx</text><path d="M311 127 H330" stroke="#4c7a73" stroke-width="2.5"/><path d="M324 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="333" y="65" width="284" height="128" rx="12" stroke="#ac673d" fill="#fff1e4"/><text x="348" y="91" font-size="14" font-weight="750" fill="#ac673d">执行</text><text x="348" y="127" font-size="19" font-weight="700" fill="#24413e">valE = rB + 8</text><text x="348" y="165" font-size="15" fill="#526a63">ALU 计算有效地址</text><path d="M620 127 H639" stroke="#4c7a73" stroke-width="2.5"/><path d="M633 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="642" y="65" width="284" height="128" rx="12" stroke="#6655a7" fill="#eeeafa"/><text x="657" y="91" font-size="14" font-weight="750" fill="#6655a7">存储</text><text x="657" y="127" font-size="19" font-weight="700" fill="#24413e">M8[valE] ← valA</text><text x="657" y="165" font-size="15" fill="#526a63">valA 来自 rA</text><rect x="25" y="211" width="910" height="35" rx="7" fill="#e4eee8"/><text x="42" y="235" font-size="15" fill="#245e57">Y86-64 rmmovq 的编码长度 = 1+1+8 = 10 B</text></svg>