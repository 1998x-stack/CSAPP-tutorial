<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">两份虚拟地址空间与一份 open file description</title><desc id="figure-desc">fork 后父子保留独立地址空间和 file descriptor 表项；继承的文件描述符指向同一内核 open file description，因此共享文件偏移。子进程的退出状态由 waitpid 回收。</desc><rect width="960" height="264" rx="16" fill="#f8fbf7"/><text x="24" y="34" font-size="21" font-weight="700" fill="#254744">两份虚拟地址空间与一份 open file description</text><rect x="23" y="62" width="286" height="132" rx="12" fill="#e5f2ed" stroke="#127d75" stroke-width="1.5"/><text x="38" y="89" font-size="14" font-weight="700" fill="#127d75">fork 返回</text><text x="38" y="126" font-size="18" font-weight="700" fill="#253f3e">parent: child PID</text><text x="38" y="163" font-size="14" fill="#4a635c">child: 0</text><path d="M313 126 H332" stroke="#417b72" stroke-width="2.5"/><path d="M324 120 l7 6 -7 6" stroke="#417b72" stroke-width="2" fill="none"/><rect x="334" y="62" width="286" height="132" rx="12" fill="#fff1e4" stroke="#ac673d" stroke-width="1.5"/><text x="349" y="89" font-size="14" font-weight="700" fill="#ac673d">内存写入</text><text x="349" y="126" font-size="18" font-weight="700" fill="#253f3e">各自私有地址空间</text><text x="349" y="163" font-size="14" fill="#4a635c">COW 只在需要时复制页</text><path d="M624 126 H643" stroke="#417b72" stroke-width="2.5"/><path d="M635 120 l7 6 -7 6" stroke="#417b72" stroke-width="2" fill="none"/><rect x="645" y="62" width="286" height="132" rx="12" fill="#eeeafa" stroke="#6655a7" stroke-width="1.5"/><text x="660" y="89" font-size="14" font-weight="700" fill="#6655a7">已打开文件</text><text x="660" y="126" font-size="18" font-weight="700" fill="#253f3e">FD 两份 → OFD 一份</text><text x="660" y="163" font-size="14" fill="#4a635c">文件偏移由 OFD 共享</text><rect x="23" y="209" width="914" height="38" rx="9" fill="#e1eee5"/><text x="39" y="233" font-size="14" font-weight="700" fill="#285b53">fork 不等于复制所有内核对象；waitpid 才回收符合条件的子进程终止状态</text></svg>