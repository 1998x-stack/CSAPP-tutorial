<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">RELATIVE 重定位和 GOT/PLT 的两条不同任务</title><desc id="figure-desc">同一个内部指针基于库装载基址和固定加数修复，例如从 0x70001230 移到 0x72001230；导入外部函数的符号绑定是另一条路径。</desc><rect width="960" height="264" rx="16" fill="#f8fbf7"/><text x="24" y="34" font-size="21" font-weight="700" fill="#254744">RELATIVE 重定位和 GOT/PLT 的两条不同任务</text><rect x="23" y="62" width="286" height="132" rx="12" fill="#e5f2ed" stroke="#127d75" stroke-width="1.5"/><text x="38" y="89" font-size="14" font-weight="700" fill="#127d75">库在布局中的偏移</text><text x="38" y="126" font-size="18" font-weight="700" fill="#253f3e">A = 0x1230</text><text x="38" y="163" font-size="14" fill="#4a635c">位置无关的内部目标</text><path d="M313 126 H332" stroke="#417b72" stroke-width="2.5"/><path d="M324 120 l7 6 -7 6" stroke="#417b72" stroke-width="2" fill="none"/><rect x="334" y="62" width="286" height="132" rx="12" fill="#fff1e4" stroke="#ac673d" stroke-width="1.5"/><text x="349" y="89" font-size="14" font-weight="700" fill="#ac673d">第一次装载基址</text><text x="349" y="126" font-size="18" font-weight="700" fill="#253f3e">B = 0x70000000</text><text x="349" y="163" font-size="14" fill="#4a635c">B+A = 0x70001230</text><path d="M624 126 H643" stroke="#417b72" stroke-width="2.5"/><path d="M635 120 l7 6 -7 6" stroke="#417b72" stroke-width="2" fill="none"/><rect x="645" y="62" width="286" height="132" rx="12" fill="#eeeafa" stroke="#6655a7" stroke-width="1.5"/><text x="660" y="89" font-size="14" font-weight="700" fill="#6655a7">另一次装载基址</text><text x="660" y="126" font-size="18" font-weight="700" fill="#253f3e">B = 0x72000000</text><text x="660" y="163" font-size="14" fill="#4a635c">B+A = 0x72001230</text><rect x="23" y="209" width="914" height="38" rx="9" fill="#e1eee5"/><text x="39" y="233" font-size="14" font-weight="700" fill="#285b53">R_X86_64_RELATIVE：B + A；外部 puts 的 JUMP_SLOT / PLT 解析另行处理</text></svg>