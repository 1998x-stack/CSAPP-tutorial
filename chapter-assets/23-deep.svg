<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" role="img" aria-labelledby="title desc"><title id="title">有界队列的条件谓词和关闭协议</title><desc id="desc">容量2的任务队列，producer 在满时等待 not_full，consumer 在空时等待 not_empty，pthread_cond_wait 在等待时原子释放互斥锁并在返回前重新加锁。关闭后拒绝新任务，已入队工作排空后退出。</desc><rect width="960" height="266" rx="15" fill="#f8fbf7"/><text x="22" y="36" font-size="20" font-weight="700" fill="#244b44">有界队列（capacity = 2）与两类条件等待</text><rect x="22" y="66" width="218" height="133" rx="11" fill="#e7f2ec" stroke="#bdd3c7"/><text x="36" y="101" font-size="20" font-weight="700" fill="#254c45">Producer</text><text x="34" y="143" font-size="14" fill="#31574f">full → wait(not_full)</text><rect x="281" y="66" width="370" height="133" rx="11" fill="#f7eee0" stroke="#bdd3c7"/><text x="295" y="101" font-size="20" font-weight="700" fill="#254c45">Queue</text><text x="293" y="143" font-size="14" fill="#31574f">slot 0 | slot 1</text><rect x="692" y="66" width="244" height="133" rx="11" fill="#eee9f6" stroke="#bdd3c7"/><text x="706" y="101" font-size="20" font-weight="700" fill="#254c45">Consumer</text><text x="704" y="143" font-size="14" fill="#31574f">empty → wait(not_empty)</text><path d="M244 125 H275" stroke="#2c8075" stroke-width="2.5"/><path d="M654 125 H686" stroke="#2c8075" stroke-width="2.5"/><rect x="23" y="212" width="914" height="37" rx="8" fill="#e2f0e8"/><text x="39" y="236" font-size="15" font-weight="700" fill="#235a4e">mutex protects count + closed；wait unlocks atomically，wake re-locks，while rechecks</text></svg>