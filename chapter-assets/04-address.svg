<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="address-title address-desc"><title id="address-title">比例变址寻址</title><desc id="address-desc">长整型数组从0x1000开始，每项8字节，下标3的位置是0x1018</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="30" fill="#203035" font-size="22" font-weight="600" text-anchor="middle">一个 long 占 8 字节：从基址走到 a[3]</text><rect x="22" y="68" width="112" height="108" rx="10" fill="#ecf1ec" stroke="#d9e2db" stroke-width="1.5"/><text x="78" y="104" fill="#52666a" font-size="21" font-weight="600" text-anchor="middle">a[0]</text><text x="78" y="147" fill="#52666a" font-size="18" font-weight="600" text-anchor="middle">0x1000</text><rect x="143" y="68" width="112" height="108" rx="10" fill="#ecf1ec" stroke="#d9e2db" stroke-width="1.5"/><text x="199" y="104" fill="#52666a" font-size="21" font-weight="600" text-anchor="middle">a[1]</text><text x="199" y="147" fill="#52666a" font-size="18" font-weight="600" text-anchor="middle">0x1008</text><rect x="264" y="68" width="112" height="108" rx="10" fill="#ecf1ec" stroke="#d9e2db" stroke-width="1.5"/><text x="320" y="104" fill="#52666a" font-size="21" font-weight="600" text-anchor="middle">a[2]</text><text x="320" y="147" fill="#52666a" font-size="18" font-weight="600" text-anchor="middle">0x1010</text><rect x="385" y="68" width="112" height="108" rx="10" fill="#cce8df" stroke="#147f80" stroke-width="1.5"/><text x="441" y="104" fill="#126968" font-size="21" font-weight="600" text-anchor="middle">a[3]</text><text x="441" y="147" fill="#126968" font-size="18" font-weight="600" text-anchor="middle">0x1018</text><rect x="506" y="68" width="112" height="108" rx="10" fill="#ecf1ec" stroke="#d9e2db" stroke-width="1.5"/><text x="562" y="104" fill="#52666a" font-size="21" font-weight="600" text-anchor="middle">a[4]</text><text x="562" y="147" fill="#52666a" font-size="18" font-weight="600" text-anchor="middle">0x1020</text><rect x="627" y="68" width="112" height="108" rx="10" fill="#ecf1ec" stroke="#d9e2db" stroke-width="1.5"/><text x="683" y="104" fill="#52666a" font-size="21" font-weight="600" text-anchor="middle">a[5]</text><text x="683" y="147" fill="#52666a" font-size="18" font-weight="600" text-anchor="middle">0x1028</text><rect x="748" y="68" width="112" height="108" rx="10" fill="#ecf1ec" stroke="#d9e2db" stroke-width="1.5"/><text x="804" y="104" fill="#52666a" font-size="21" font-weight="600" text-anchor="middle">a[6]</text><text x="804" y="147" fill="#52666a" font-size="18" font-weight="600" text-anchor="middle">0x1030</text><text x="440" y="218" fill="#175d5e" font-size="26" font-weight="600" text-anchor="middle">EA = 0x1000 + 3 × 8 = 0x1018</text><text x="440" y="269" fill="#536a6a" font-size="20" font-weight="600" text-anchor="middle">(%rdi, %rsi, 8) → rdi 是基址，rsi 是下标</text></svg>