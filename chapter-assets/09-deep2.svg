<svg viewBox="0 0 880 288" role="img" aria-labelledby="d09bt d09bd" xmlns="http://www.w3.org/2000/svg">
<title id="d09bt">转发优先级：越新的在途生产者越优先</title>
<desc id="d09bd">五级流水线中 W、M、E 三个流水级可能同时持有同一目的寄存器的结果；译码级消费者优先选取最新（最靠近 E）的匹配生产者。若最新生产者是仍处于 E 的 load，其值要到 M 末才产生，控制逻辑选它并停顿一拍，而不是退回较旧的 ALU 结果。</desc>
<rect width="880" height="288" fill="#fbfdf9"/>
<text x="24" y="32" font-size="16" fill="#24433f">同一寄存器 %rax 在流水线中有多个在途生产者</text>
<g font-family="system-ui,sans-serif">
<rect x="40" y="60" width="150" height="46" rx="8" fill="#e7eef4" stroke="#356c88"/>
<text x="115" y="82" font-size="15" text-anchor="middle" fill="#27495c">W: addq → %rax</text>
<text x="115" y="100" font-size="12" text-anchor="middle" fill="#556b78">最旧，已算出</text>
<rect x="40" y="118" width="150" height="46" rx="8" fill="#ece8f6" stroke="#65539b"/>
<text x="115" y="140" font-size="15" text-anchor="middle" fill="#4a3d78">M: xorq → %rax</text>
<text x="115" y="158" font-size="12" text-anchor="middle" fill="#5f5680">已算出</text>
<rect x="40" y="176" width="150" height="46" rx="8" fill="#fdeeee" stroke="#b23b3b"/>
<text x="115" y="198" font-size="15" text-anchor="middle" fill="#7a2626">E: mrmovq → %rax</text>
<text x="115" y="216" font-size="12" text-anchor="middle" fill="#8a3b3b">最新，M 末才就绪</text>
<rect x="330" y="118" width="180" height="60" rx="8" fill="#f3f6fb" stroke="#4a6fa5"/>
<text x="420" y="145" font-size="15" text-anchor="middle" fill="#27395a">转发选择：取最新匹配</text>
<text x="420" y="166" font-size="13" text-anchor="middle" fill="#3f5a86">youngest wins</text>
<rect x="640" y="118" width="200" height="60" rx="8" fill="#fff0e4" stroke="#cfa38c"/>
<text x="740" y="145" font-size="15" text-anchor="middle" fill="#9d5537">D: 消费者需要 %rax</text>
<text x="740" y="166" font-size="13" text-anchor="middle" fill="#a5613f">选 E，但值未就绪</text>
<g stroke="#597b77" stroke-width="2" fill="none">
<path d="M190 83 H300 V140 H326"/>
<path d="M190 141 H326"/>
<path d="M190 199 H300 V156 H326"/>
<path d="M510 148 H636"/>
</g>
<text x="560" y="140" font-size="18" text-anchor="middle" fill="#8a3b3b">✕</text>
<text x="24" y="258" font-size="14" fill="#8a2b2b">选择最新生产者 ⇒ 命中 load(E) ⇒ 停顿一拍，而非退回较旧结果</text>
<text x="24" y="279" font-size="13" fill="#55716f">教学示意：控制信号与旁路通路已简化，非任何真实微架构实测</text>
</g>
</svg>
