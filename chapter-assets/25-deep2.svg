<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="d25b-t d25b-d">
<title id="d25b-t">组相联 Cache 地址拆分与 LRU 驱逐：s=2、E=2、b=4 的教学算例</title>
<desc id="d25b-d">地址拆成 tag、组索引 s 位和块偏移 b 位三部分。教学参数 s=2、E=2、b=4：偏移 4 位，组索引 2 位，tag 取其余高位。右下方是组 0 的两路内容按最近使用顺序排列。依次访问 0x000、0x100 都未命中并填入两路；再读 0x000 命中并把该行提到最近使用；随后访问 0x200 未命中，需驱逐最久未使用的 tag4；最后再读 0x000 命中。该算例的命中 2、未命中 3、驱逐 1 是教学模拟结果，不是实机性能测量。</desc>
<rect x="0" y="0" width="960" height="300" fill="#fbfaf7"/>
<g font-family="system-ui,sans-serif">
<text x="24" y="30" font-size="16" font-weight="700" fill="#24433f">s=2（4 组）、E=2（2 路）、b=4（16 字节/行）：地址怎么拆</text>

<rect x="24" y="50" width="250" height="40" rx="6" fill="#f0edfa" stroke="#b9aedf"/>
<text x="149" y="75" text-anchor="middle" font-family="ui-monospace,monospace" fill="#5b4d94">tag（其余高位）</text>
<rect x="278" y="50" width="180" height="40" rx="6" fill="#e8f3f0" stroke="#97c6bf"/>
<text x="368" y="75" text-anchor="middle" font-family="ui-monospace,monospace" fill="#1d5b5e">组索引 s=2</text>
<rect x="462" y="50" width="140" height="40" rx="6" fill="#fff2e9" stroke="#dcb8a6"/>
<text x="532" y="75" text-anchor="middle" font-family="ui-monospace,monospace" fill="#955335">偏移 b=4</text>

<text x="24" y="128" font-size="14" font-weight="700" fill="#24433f">组 0（两路）按最近使用顺序</text>
<text x="24" y="156" font-size="13" fill="#53676d">访问 0x000、0x100 后：　最久未用 [tag0] → 最近使用 [tag4]</text>
<text x="24" y="180" font-size="13" fill="#53676d">读 0x000 命中：　　　　　[tag4] → [tag0]</text>
<text x="24" y="204" font-size="13" fill="#53676d">访问 0x200 未命中：驱逐 [tag4]（LRU），填入 [tag8]</text>

<rect x="620" y="100" width="316" height="150" rx="10" fill="#f3f6fb" stroke="#4a6fa5"/>
<g font-size="13" fill="#27395a">
<text x="640" y="128" font-weight="700">教学模拟计数</text>
<text x="640" y="154" font-family="ui-monospace,monospace">access = 5</text>
<text x="640" y="176" font-family="ui-monospace,monospace">hit    = 2</text>
<text x="640" y="198" font-family="ui-monospace,monospace">miss   = 3</text>
<text x="640" y="220" font-family="ui-monospace,monospace">evict  = 1</text>
<text x="640" y="242" font-size="11.5" fill="#53676d">为教学曲线，非实机测量</text>
</g>
</g>
<text x="24" y="284" font-size="12.5" fill="#53676d">替换策略（如 LRU）是本题设定的规则；真实硬件的写策略、预取与关联度会更复杂。</text>
</svg>
