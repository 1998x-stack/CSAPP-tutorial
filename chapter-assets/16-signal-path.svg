<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="s16p-title s16p-desc"><title id="s16p-title">信号生成待处理与递送</title><desc id="s16p-desc">信号被生成后可能处于待处理状态；屏蔽会推迟递送，解除屏蔽后按处置执行</desc><rect width="880" height="310" fill="#fbfcf8"/><text x="440" y="35" fill="#203035" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="600" text-anchor="middle">一次信号的三段旅程</text><rect x="26" y="70" width="218" height="102" rx="10" fill="#e3eee8" stroke="#c9d9d0" stroke-width="1.6"/><text x="135" y="104" fill="#176d69" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">生成</text><text x="135" y="137" fill="#536a68" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">终端 / 内核 / kill</text><path d="M244,121 L329,121" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M329 121 L319.3465918192059 126.27368092464623 M329 121 L319.3465918192059 115.72631907535377" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><rect x="338" y="70" width="210" height="102" rx="10" fill="#f4e8d8" stroke="#e4c9ad" stroke-width="1.6"/><text x="443" y="104" fill="#97683a" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">待处理</text><text x="443" y="137" fill="#7f6c59" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">pending 状态</text><path d="M548,121 L634,121" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><path d="M634 121 L624.3465918192059 126.27368092464623 M634 121 L624.3465918192059 115.72631907535377" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round"/><rect x="644" y="70" width="210" height="102" rx="10" fill="#e3e9f5" stroke="#c4cce2" stroke-width="1.6"/><text x="749" y="104" fill="#62599a" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" text-anchor="middle">递送</text><text x="749" y="137" fill="#615e78" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle">默认 / 忽略 / handler</text><rect x="328" y="215" width="232" height="58" rx="10" fill="#f9e5dd" stroke="#e1b9a8" stroke-width="1.6"/><text x="444" y="241" fill="#9a5b41" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="600" text-anchor="middle">已屏蔽：暂缓递送</text><text x="444" y="262" fill="#966e62" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="middle">未丢弃，但不累加次数</text><path d="M443,172 L443,215" fill="none" stroke="#c47b57" stroke-width="2" stroke-linecap="round"/><text x="440" y="298" fill="#697875" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" text-anchor="middle">普通非实时信号通常不按“产生次数”排队</text></svg>