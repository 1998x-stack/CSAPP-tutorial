<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 264"><title id="title">五级流水线 load-use 的七周期时序</title><desc id="desc">加载指令周期一至五依次执行 F D E M W；紧随 addq 的消费者周期二取指，三译码，四停在译码，五执行，六访存，七写回；周期四执行级是气泡。</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#234b43">Load–Use：第 4 周期为何必须插入 bubble？</text><text x="28" y="62" font-size="14" fill="#546d65">固定五级模型 · F=Fetch D=Decode E=Execute M=Memory W=Writeback</text><text x="291" y="91" font-size="14" fill="#526c65" text-anchor="middle">Cycle 1</text><text x="385" y="91" font-size="14" fill="#526c65" text-anchor="middle">Cycle 2</text><text x="479" y="91" font-size="14" fill="#526c65" text-anchor="middle">Cycle 3</text><text x="573" y="91" font-size="14" fill="#526c65" text-anchor="middle">Cycle 4</text><text x="667" y="91" font-size="14" fill="#526c65" text-anchor="middle">Cycle 5</text><text x="761" y="91" font-size="14" fill="#526c65" text-anchor="middle">Cycle 6</text><text x="855" y="91" font-size="14" fill="#526c65" text-anchor="middle">Cycle 7</text><text x="28" y="128" font-size="17" font-weight="700" fill="#234b43">mrmovq</text><rect x="250" y="105" width="86" height="32" rx="5" fill="#ddf0e6" stroke="#c3d6cb"/><text x="293" y="127" text-anchor="middle" font-size="15" font-weight="500" fill="#234843">F</text><rect x="344" y="105" width="86" height="32" rx="5" fill="#ddf0e6" stroke="#c3d6cb"/><text x="387" y="127" text-anchor="middle" font-size="15" font-weight="500" fill="#234843">D</text><rect x="438" y="105" width="86" height="32" rx="5" fill="#ddf0e6" stroke="#c3d6cb"/><text x="481" y="127" text-anchor="middle" font-size="15" font-weight="500" fill="#234843">E</text><rect x="532" y="105" width="86" height="32" rx="5" fill="#e7e1fa" stroke="#c3d6cb"/><text x="575" y="127" text-anchor="middle" font-size="15" font-weight="500" fill="#234843">M</text><rect x="626" y="105" width="86" height="32" rx="5" fill="#ddf