<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">Load–Use 的一周期停顿</title><desc id="figure-desc">load 的产出;M 阶段末出现 valM;F1 D2 E3 M4 W5 → 紧邻消费者;在 E 开始前需要操作数;F2 D3 · 等待一拍 → 控制信号;F/D stall · E bubble;消费者 E5 M6 W7</desc><rect width="960" height="264" rx="14" fill="#f8faf6"/><text x="26" y="35" font-size="21" font-weight="700" fill="#254744">Load–Use 的一周期停顿</text><rect x="24" y="65" width="284" height="128" rx="12" stroke="#126b67" fill="#e5f2ed"/><text x="39" y="91" font-size="14" font-weight="750" fill="#126b67">load 的产出</text><text x="39" y="127" font-size="19" font-weight="700" fill="#24413e">M 阶段末出现 valM</text><text x="39" y="165" font-size="15" fill="#526a63">F1 D2 E3 M4 W5</text><path d="M311 127 H330" stroke="#4c7a73" stroke-width="2.5"/><path d="M324 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="333" y="65" width="284" height="128" rx="12" stroke="#ac673d" fill="#fff1e4"/><text x="348" y="91" font-size="14" font-weight="750" fill="#ac673d">紧邻消费者</text><text x="348" y="127" font-size="19" font-weight="700" fill="#24413e">在 E 开始前需要操作数</text><text x="348" y="165" font-size="15" fill="#526a63">F2 D3 · 等待一拍</text><path d="M620 127 H639" stroke="#4c7a73" stroke-width="2.5"/><path d="M633 121 l7 6 -7 6" stroke="#4c7a73" stroke-width="2" fill="none"/><rect x="642" y="65" width="284" height="128" rx="12" stroke="#6655a7" fill="#eeeafa"/><text x="657" y="91" font-size="14" font-weight="750" fill="#6655a7">控制信号</text><text x="657" y="127" font-size="19" font-weight="700" fill="#24413e">F/D stall · E bubble</text><text x="657" y="165" font-size="15" fill="#526a63">消费者 E5 M6 W7</text><rect x="25" y="211" width="910" height="35" rx="7" fill="#e4eee8"/><text x="42" y="235" font-size="15" fill="#245e57">经典五级 PIPE 时序：load-use 一拍停顿；非所有真实 CPU 都相同</text></svg>