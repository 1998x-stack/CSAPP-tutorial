f8faf6" stroke="#c3d6cb"/><text x="293" y="205" text-anchor="middle" font-size="15" font-weight="500" fill="#234843"></text><rect x="344" y="183" width="86" height="32" rx="5" fill="#f8faf6" stroke="#c3d6cb"/><text x="387" y="205" text-anchor="middle" font-size="15" font-weight="500" fill="#234843"></text><rect x="438" y="183" width="86" height="32" rx="5" fill="#f8faf6" stroke="#c3d6cb"/><text x="481" y="205" text-anchor="middle" font-size="15" font-weight="500" fill="#234843"></text><rect x="532" y="183" width="86" height="32" rx="5" fill="#ffd6bd" stroke="#c3d6cb"/><text x="575" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#234843">●</text><rect x="626" y="183" width="86" height="32" rx="5" fill="#f8faf6" stroke="#c3d6cb"/><text x="669" y="205" text-anchor="middle" font-size="15" font-weight="500" fill="#234843"></text><rect x="720" y="183" width="86" height="32" rx="5" fill="#f8faf6" stroke="#c3d6cb"/><text x="763" y="205" text-anchor="middle" font-size="15" font-weight="500" fill="#234843"></text><rect x="814" y="183" width="86" height="32" rx="5" fill="#f8faf6" stroke="#c3d6cb"/><text x="857" y="205" text-anchor="middle" font-size="15" font-weight="500" fill="#234843"></text><text x="27" y="250" font-size="14" fill="#546d65">M 阶段末才有 load 的数据；消费者到第 5 周期 E 阶段才用到它</text></svg>