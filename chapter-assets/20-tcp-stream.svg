<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" role="img" aria-labelledby="t d"><title id="t">两次发送与三次接收的字节流示意</title><desc id="d">发送端按 HE 和 LLO 两次写入，接收端可能按 H、ELL、O 三次读出，顺序仍是 HELLO。</desc><rect width="920" height="270" rx="18" fill="#f6f8f5"/><g font-family="Arial,sans-serif" fill="#2e4d50" font-size="22"><text x="40" y="47">发送端调用</text><text x="40" y="205">接收端调用</text></g><rect x="320" y="20" width="150" height="60" rx="10" fill="#d6ece6" stroke="#147f80"/><rect x="482" y="20" width="255" height="60" rx="10" fill="#d6ece6" stroke="#147f80"/><g font-family="Arial,sans-serif" fill="#1e5155" font-size="25" text-anchor="middle"><text x="395" y="59">HE</text><text x="609" y="59">LLO</text></g><path d="M420 86 L420 160 M610 86 L610 160" stroke="#809e93" stroke-dasharray="7 7" stroke-width="3"/><rect x="320" y="166" width="95" height="63" rx="10" fill="#e9e3fa" stroke="#7461ba"/><rect x="427" y="166" width="195" height="63" rx="10" fill="#e9e3fa" stroke="#7461ba"/><rect x="634" y="166" width="103" height="63" rx="10" fill="#e9e3fa" stroke="#7461ba"/><g font-family="Arial,sans-serif" fill="#493d7c" font-size="24" text-anchor="middle"><text x="367" y="205">H</text><text x="524" y="205">ELL</text><text x="685" y="205">O</text></g><text x="775" y="153" fill="#6b7d78" font-family="Arial,sans-serif" font-size="18">顺序不变</text></svg>