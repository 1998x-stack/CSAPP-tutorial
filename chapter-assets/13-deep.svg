<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" role="img" aria-labelledby="figure-title figure-desc"><title id="figure-title">R_X86_64_PC32 的位移计算</title><desc id="figure-desc">P 指向调用指令中的四字节重定位字段，S 是目标符号地址，A 是 addend。用 S+A-P 算出位移 0x3b，写成小端字节 3b 00 00 00。</desc><rect width="960" height="264" rx="16" fill="#f8fbf7"/><text x="24" y="34" font-size="21" font-weight="700" fill="#254744">R_X86_64_PC32 的位移计算</text><rect x="23" y="62" width="286" height="132" rx="12" fill="#e5f2ed" stroke="#127d75" stroke-width="1.5"/><text x="38" y="89" font-size="14" font-weight="700" fill="#127d75">符号地址 S</text><text x="38" y="126" font-size="18" font-weight="700" fill="#253f3e">0x401100</text><text x="38" y="163" font-size="14" fill="#4a635c">目标函数入口</text><path d="M313 126 H332" stroke="#417b72" stroke-width="2.5"/><path d="M324 120 l7 6 -7 6" stroke="#417b72" stroke-width="2" fill="none"/><rect x="334" y="62" width="286" height="132" rx="12" fill="#fff1e4" stroke="#ac673d" stroke-width="1.5"/><text x="349" y="89" font-size="14" font-weight="700" fill="#ac673d">重定位字段 P</text><text x="349" y="126" font-size="18" font-weight="700" fill="#253f3e">0x4010c1</text><text x="349" y="163" font-size="14" fill="#4a635c">call 后四字节的起点</text><path d="M624 126 H643" stroke="#417b72" stroke-width="2.5"/><path d="M635 120 l7 6 -7 6" stroke="#417b72" stroke-width="2" fill="none"/><rect x="645" y="62" width="286" height="132" rx="12" fill="#eeeafa" stroke="#6655a7" stroke-width="1.5"/><text x="660" y="89" font-size="14" font-weight="700" fill="#6655a7">Addend A</text><text x="660" y="126" font-size="18" font-weight="700" fill="#253f3e">-4</text><text x="660" y="163" font-size="14" fill="#4a635c">x86-64 相对下一条指令</text><rect x="23" y="209" width="914" height="38" rx="9" fill="#e1eee5"/><text x="39" y="233" font-size="14" font-weight="700" fill="#285b53">R=S+A−P=0x3b；E8 3B 00 00 00 的下一条指令地址 0x4010c5</text></svg>