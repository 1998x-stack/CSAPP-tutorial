<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" role="img" aria-labelledby="t d">
<title id="t">有界复制与无界复制的区别</title><desc id="d">左侧把输入长度限制在目标缓冲区容量内并保留结束符；右侧无边界检查的概念图显示写入超出缓冲区，可能破坏相邻状态。未给出任何实际利用布局或地址。</desc>
<rect width="940" height="310" rx="16" fill="#f8f9f4"/><rect x="24" y="24" width="427" height="248" rx="12" fill="#fff" stroke="#d9e6db"/><rect x="489" y="24" width="427" height="248" rx="12" fill="#fff" stroke="#e6dcd7"/>
<text x="43" y="64" font-size="21" font-weight="700" fill="#146c62">有界读取</text><text x="509" y="64" font-size="21" font-weight="700" fill="#b15e40">没有容量约束</text>
<g font-size="16" text-anchor="middle"><rect x="43" y="90" width="388" height="56" rx="8" fill="#dff1e8"/><text x="237" y="123" fill="#245b54">输入长度 ≤ 容量 − 1</text><rect x="43" y="166" width="388" height="52" rx="8" fill="#eef6ef" stroke="#84bda3"/><text x="237" y="197" fill="#276359">缓冲区 + 字符串结束符</text><rect x="509" y="90" width="388" height="56" rx="8" fill="#fff0e5"/><text x="703" y="123" fill="#a15a3b">输入长度可能大于容量</text><rect x="509" y="166" width="240" height="52" rx="8" fill="#e9f1e9" stroke="#a2c4a5"/><text x="629" y="198" fill="#2d6858">目标缓冲区</text><rect x="749" y="166" width="148" height="52" rx="8" fill="#f7dcd2" stroke="#c87761"/><text x="823" y="198" fill="#a44d35">越界写入</text></g>
<text x="35" y="292" font-size="15" fill="#576e67">关键问题是写入长度是否受目标对象容量约束，而不是输入看起来是否“正常”。</text></svg>