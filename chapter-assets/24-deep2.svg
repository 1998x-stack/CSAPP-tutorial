<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="d24b-t d24b-d">
<title id="d24b-t">逻辑右移与算术右移：同一位模式、不同移入位，Data Lab 用掩码补齐</title>
<desc id="d24b-d">取 32 位模式 x = 0x80000000，右移 4 位。算术右移把符号位复制进来，得到 0xF8000000；逻辑右移移入 0，得到 0x08000000。C 标准对有符号右移的具体结果是实现定义的，所以 Data Lab 的 logicalShift 先做右移再与掩码 ~(~0 &lt;&lt; (32-n)) 相与，把高 n 位清零；当 n 等于 0 时移位量等于字长属于未定义行为，必须单独处理。图中数值为教学算例。</desc>
<rect x="0" y="0" width="960" height="300" fill="#fbfaf7"/>
<g font-family="ui-monospace,Menlo,monospace">
<text x="24" y="30" font-size="16" font-weight="700" fill="#24433f" font-family="system-ui,sans-serif">x = 0x80000000（32 位模式），n = 4</text>
<text x="40" y="78" font-size="15" fill="#27395a">原值   1000 0000 … 0000</text>
<rect x="40" y="94" width="360" height="30" rx="6" fill="#eef1f4" stroke="#b9c2c8"/>
<text x="52" y="115" font-size="14" fill="#203b41">1 000…000  （最高位为 1）</text>

<text x="40" y="166" font-size="14" fill="#8a2b2b" font-family="system-ui,sans-serif">算术右移 &gt;&gt;4 （有符号，符号位复制）</text>
<rect x="40" y="178" width="360" height="30" rx="6" fill="#fdeeee" stroke="#d9a8a8"/>
<text x="52" y="199" font-size="14" fill="#8a2b2b">1111 1000 0000 … = 0xF8000000</text>

<text x="40" y="242" font-size="14" fill="#1d5b5e" font-family="system-ui,sans-serif">逻辑右移 &gt;&gt;4 （移入 0）</text>
<rect x="40" y="254" width="360" height="30" rx="6" fill="#e8f3f0" stroke="#97c6bf"/>
<text x="52" y="275" font-size="14" fill="#1d5b5e">0000 1000 0000 … = 0x08000000</text>

<rect x="440" y="78" width="496" height="206" rx="10" fill="#f3f6fb" stroke="#4a6fa5"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#27395a">
<text x="460" y="106" font-weight="700">C 里的两个字面陷阱</text>
<text x="460" y="134" fill="#203b41">① 有符号右移结果实现定义：</text>
<text x="460" y="156" fill="#203b41">   实践中多为算术右移，标准不保证。</text>
<text x="460" y="184" fill="#203b41">② 移位量 ≥ 字长属未定义行为（C11 §6.5.7）：</text>
<text x="460" y="206" fill="#203b41">   n=0 时 (32-n) 得 32，直接移位即 UB。</text>
<text x="460" y="234" fill="#8a2b2b">写法：先右移，再与掩码 ~(~0 &lt;&lt; (32-n)) 相与，</text>
<text x="460" y="256" fill="#8a2b2b">把高 n 位清零；n=0 分支单独返回 x。</text>
</g>
</g>
<text x="24" y="292" font-size="12.5" fill="#53676d" font-family="system-ui,sans-serif">教学算例：位模式按 32 位两补数理解，不是对某台机器移位指令的实测。</text>
</svg>
