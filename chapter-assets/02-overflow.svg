<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="overflow-title overflow-desc"><title id="overflow-title">C 整数溢出语义</title><desc id="overflow-desc">无符号回绕有定义，而有符号溢出是未定义行为</desc><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}svg{background:#fbfcf8}</style><text x="440" y="30" fill="#203035" font-size="23" font-weight="600" text-anchor="middle">越过边界时，C 语言的规则不同</text><text x="137" y="81" fill="#516566" font-size="18" font-weight="600" text-anchor="middle">无符号 8 位模型</text><rect x="35" y="93" width="172" height="55" rx="10" fill="#cde8df" stroke="#dee7df" stroke-width="1.5"/><text x="121" y="128" fill="#203035" font-size="24" font-weight="600" text-anchor="middle">255 + 1</text><text x="275" y="128" fill="#6d8582" font-size="29" font-weight="600" text-anchor="middle">→</text><rect x="340" y="93" width="215" height="55" rx="10" fill="#cde8df" stroke="#dee7df" stroke-width="1.5"/><text x="447" y="127" fill="#106e68" font-size="24" font-weight="600" text-anchor="middle">0</text><text x="585" y="126" fill="#526766" font-size="17" font-weight="500" text-anchor="start">模 256 回绕（有定义）</text><text x="137" y="202" fill="#516566" font-size="18" font-weight="600" text-anchor="middle">有符号 8 位模型</text><rect x="35" y="214" width="172" height="55" rx="10" fill="#f5dfd6" stroke="#dee7df" stroke-width="1.5"/><text x="121" y="249" fill="#203035" font-size="24" font-weight="600" text-anchor="middle">127 + 1</text><text x="275" y="249" fill="#6d8582" font-size="29" font-weight="600" text-anchor="middle">→</text><rect x="340" y="214" width="215" height="55" rx="10" fill="#f5dfd6" stroke="#dee7df" stroke-width="1.5"/><text x="447" y="248" fill="#9a5239" font-size="24" font-weight="600" text-anchor="middle">超出范围</text><text x="585" y="247" fill="#526766" font-size="17" font-weight="500" text-anchor="start">若运算宽度真为 8 位：无定义结果</text></svg>