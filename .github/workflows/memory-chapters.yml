name: Memory chapters 11–12 checks
on:
  pull_request:
    paths:
      - '11.html'
      - '12.html'
      - 'docs/chapters/11-*'
      - 'docs/evidence/11.json'
      - 'docs/chapters/12-*'
      - 'docs/evidence/12.json'
      - 'docs/chapters/assets/11-*'
      - 'docs/chapters/assets/12-*'
      - 'labs/cache/**'
      - 'tests/content/chapter11-12.test.mjs'
      - 'scripts/verify-memory-labs.py'
      - '.github/workflows/memory-chapters.yml'
  push:
    branches: [main]
    paths:
      - '11.html'
      - '12.html'
      - 'docs/chapters/11-*'
      - 'docs/evidence/11.json'
      - 'docs/chapters/12-*'
      - 'docs/evidence/12.json'
      - 'labs/cache/**'
      - 'tests/content/chapter11-12.test.mjs'
      - 'scripts/verify-memory-labs.py'
      - '.github/workflows/memory-chapters.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate chapter metadata and links
        run: |
          npm run check:content
          npm run check:links
      - name: Test diagrams, evidence and interactions
        run: node --test tests/content/chapter11-12.test.mjs
      - name: Compile and run C11 invariants
        run: python3 scripts/verify-memory-labs.py
      - name: Build site
        run: npm run build
