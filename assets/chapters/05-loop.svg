<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">循环是带有回边的控制流图</title><desc id="desc">初始化 i=0，条件 i&lt;n 成立则运行循环体并令 i 加一，箭头返回条件；不成立则退出。</desc><rect width="760" height="300" rx="20" fill="#f7faf8"/><g font-family="sans-serif" text-anchor="middle"><rect x="20" y="116" width="132" height="68" rx="11" fill="#e4efed" stroke="#147f80" stroke-width="2"/><text x="86" y="157" font-size="20" fill="#155c60">i = 0</text><path d="M152 150H230" stroke="#147f80" stroke-width="3"/><path d="m221 143 11 7-11 7" fill="#147f80"/><polygon points="316,88 402,150 316,212 230,150" fill="#fff3e8" stroke="#bd6544" stroke-width="2.5"/><text x="316" y="157" font-size="21" fill="#8e4b33">i &lt; n ?</text><path d="M402 150H486" stroke="#147f80" stroke-width="3"/><path d="m477 143 11 7-11 7" fill="#147f80"/><text x="447" y="134" font-size="17" fill="#147f80">是</text><rect x="488" y="108" width="220" height="84" rx="12" fill="#e4f2ed" stroke="#147f80" stroke-width="2"/><text x="598" y="140" font-size="20" fill="#185e60">执行 body</text><text x="598" y="168" font-size="20" fill="#185e60">然后 i++</text><path d="M600 192V257H316V213" stroke="#6e5ca8" stroke-width="3" fill="none"/><path d="m308 222 8-12 8 12" fill="#6e5ca8"/><text x="470" y="283" font-size="17" fill="#6e5ca8">回边：下一轮条件检查</text><path d="M316 88V47H638V71" stroke="#bd6544" stroke-width="3" fill="none"/><path d="m630 62 8 12 8-12" fill="#bd6544"/><rect x="581" y="70" width="115" height="30" rx="10" fill="#fdece4"/><text x="638" y="91" font-size="18" fill="#954b34">否：退出</text></g></svg>