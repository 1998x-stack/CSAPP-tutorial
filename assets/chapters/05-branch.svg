<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">条件分支从 C 判断到机器跳转</title><desc id="desc">cmp 先设置条件码，jge 按有符号大于等于分流到两个基本块，最终在汇合点合并。</desc><rect width="760" height="300" rx="20" fill="#f7faf8"/><g font-family="sans-serif" text-anchor="middle"><rect x="30" y="105" width="185" height="90" rx="14" fill="#e5f2ed" stroke="#147f80" stroke-width="2"/><text x="122" y="140" font-size="22" fill="#164f50">cmp b, a</text><text x="122" y="171" font-size="16" fill="#3f686b">设置 ZF / SF / OF</text><path d="M215 150H294" stroke="#147f80" stroke-width="3" fill="none"/><path d="m284 142 12 8-12 8" fill="#147f80"/><rect x="296" y="112" width="150" height="77" rx="12" fill="#fff1e9" stroke="#c16c48" stroke-width="2"/><text x="371" y="145" font-size="22" fill="#814832">jge</text><text x="371" y="171" font-size="16" fill="#814832">SF == OF ?</text><path d="M446 135H508V74H553" stroke="#147f80" stroke-width="3" fill="none"/><path d="m543 66 12 8-12 8" fill="#147f80"/><path d="M446 164H508V228H553" stroke="#bc6242" stroke-width="3" fill="none"/><path d="m543 220 12 8-12 8" fill="#bc6242"/><text x="510" y="59" fill="#147f80" font-size="17">成立</text><text x="510" y="252" fill="#bc6242" font-size="17">不成立</text><rect x="555" y="37" width="174" height="74" rx="12" fill="#e3f2ed" stroke="#147f80" stroke-width="2"/><text x="642" y="68" font-size="19" fill="#185e60">a ≥ b</text><text x="642" y="91" font-size="15" fill="#37676a">跳转分支</text><rect x="555" y="189" width="174" height="74" rx="12" fill="#fdece4" stroke="#bc6242" stroke-width="2"/><text x="642" y="220" font-size="19" fill="#8c4b34">a &lt; b</text><text x="642" y="242" font-size="15" fill="#8c4b34">顺序落下</text></g></svg>