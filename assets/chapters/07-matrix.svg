<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">3乘4矩阵的行优先内存布局</title><desc id="desc">二维数组 int matrix[3][4] 在内存中按行优先排列。元素 matrix[2][1] 是第九个元素，偏移 36 字节。</desc><rect width="760" height="300" rx="20" fill="#f7faf8"/><g font-family="sans-serif" text-anchor="middle"><text x="380" y="36" font-size="21" fill="#385a5e">内存连续：每格 4 字节（假设 sizeof(int)=4）</text><g fill="#e4f2ed" stroke="#147f80" stroke-width="1.5"><rect x="45" y="64" width="168" height="52" rx="8"/><rect x="217" y="64" width="168" height="52" rx="8"/><rect x="389" y="64" width="168" height="52" rx="8"/><rect x="561" y="64" width="155" height="52" rx="8"/><rect x="45" y="124" width="168" height="52" rx="8"/><rect x="217" y="124" width="168" height="52" rx="8"/><rect x="389" y="124" width="168" height="52" rx="8"/><rect x="561" y="124" width="155" height="52" rx="8"/><rect x="45" y="184" width="168" height="52" rx="8"/></g><rect x="217" y="184" width="168" height="52" rx="8" fill="#fceadd" stroke="#bc6242" stroke-width="2.5"/><rect x="389" y="184" width="168" height="52" rx="8" fill="#e4f2ed" stroke="#147f80" stroke-width="1.5"/><rect x="561" y="184" width="155" height="52" rx="8" fill="#e4f2ed" stroke="#147f80" stroke-width="1.5"/><g font-size="20" fill="#285e5f"><text x="129" y="98">[0][0]</text><text x="301" y="98">[0][1]</text><text x="473" y="98">[0][2]</text><text x="638" y="98">[0][3]</text><text x="129" y="158">[1][0]</text><text x="301" y="158">[1][1]</text><text x="473" y="158">[1][2]</text><text x="638" y="158">[1][3]</text><text x="129" y="218">[2][0]</text><text x="473" y="218">[2][2]</text><text x="638" y="218">[2][3]</text></g><text x="301" y="218" font-size="20" fill="#91513a">[2][1]</text><text x="380" y="274" font-size="20" fill="#5a676a">偏移 = (2 × 4 + 1) × 4 = 36 字节</text></g></svg>