<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">call 与 ret 操作栈的示意</title><desc id="desc">执行 call 先把下一条指令地址压栈再跳到 callee；执行 ret 从栈顶取回返回地址并跳回 caller。</desc><rect width="760" height="300" rx="20" fill="#f7faf8"/><g font-family="sans-serif"><rect x="35" y="48" width="230" height="200" rx="14" fill="#e8f3ef" stroke="#147f80" stroke-width="2"/><text x="150" y="82" font-size="22" text-anchor="middle" fill="#155f61">caller</text><text x="62" y="128" font-family="monospace" font-size="21" fill="#215359">call callee</text><text x="62" y="172" font-family="monospace" font-size="21" fill="#215359">next:</text><text x="62" y="204" font-size="16" fill="#55787a">返回后从这里继续</text><rect x="500" y="48" width="220" height="200" rx="14" fill="#fff0e8" stroke="#bc6242" stroke-width="2"/><text x="610" y="82" font-size="22" text-anchor="middle" fill="#8b4a32">callee</text><text x="536" y="130" font-family="monospace" font-size="22" fill="#8b4a32">...</text><text x="536" y="172" font-family="monospace" font-size="22" fill="#8b4a32">ret</text><path d="M266 108H495" stroke="#147f80" stroke-width="3"/><path d="m486 100 12 8-12 8" fill="#147f80"/><text x="380" y="94" fill="#147f80" font-size="18" text-anchor="middle">call 跳转</text><path d="M498 222H268" stroke="#bc6242" stroke-width="3"/><path d="m278 214-12 8 12 8" fill="#bc6242"/><text x="380" y="244" fill="#bc6242" font-size="18" text-anchor="middle">ret 恢复 PC</text><rect x="307" y="128" width="148" height="63" rx="10" fill="#eeeafa" stroke="#6e5ca8"/><text x="381" y="150" font-size="17" text-anchor="middle" fill="#5d4e8d">栈顶保存</text><text x="381" y="177" font-size="17" text-anchor="middle" fill="#5d4e8d">next 的地址</text></g></svg>