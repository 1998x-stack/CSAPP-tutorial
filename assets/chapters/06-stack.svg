<svg xmlns="http://www.w3.org/2000/svg" width="760" height="315" viewBox="0 0 760 315" role="img" aria-labelledby="title desc"><title id="title">递归调用中的栈帧层次</title><desc id="desc">以 factorial 3 为例，调用链 factorial(3)、factorial(2)、factorial(1) 依次入栈，随后按相反顺序返回；示意不代表固定字节布局。</desc><rect width="760" height="315" rx="20" fill="#f7faf8"/><g font-family="sans-serif" text-anchor="middle"><text x="125" y="42" font-size="18" fill="#537078">较高地址</text><rect x="165" y="54" width="380" height="58" rx="9" fill="#eef0fa" stroke="#6e5ca8" stroke-width="2"/><text x="355" y="90" font-size="23" fill="#5d4e8d">factorial(3) 等待 2 的结果</text><rect x="165" y="119" width="380" height="58" rx="9" fill="#e4f2ed" stroke="#147f80" stroke-width="2"/><text x="355" y="155" font-size="23" fill="#17686a">factorial(2) 等待 1 的结果</text><rect x="165" y="184" width="380" height="58" rx="9" fill="#fff1e8" stroke="#bc6242" stroke-width="2"/><text x="355" y="220" font-size="23" fill="#915138">factorial(1) 返回 1</text><path d="M585 65V235" stroke="#6e5ca8" stroke-width="4"/><path d="m574 224 11 17 11-17" fill="#6e5ca8"/><text x="661" y="153" font-size="19" fill="#5d4e8d">栈向</text><text x="661" y="179" font-size="19" fill="#5d4e8d">低地址</text><text x="356" y="280" font-size="17" fill="#60767a">返回时自下而上：1 → 2 → 6</text></g></svg>