<svg xmlns="http://www.w3.org/2000/svg" width="760" height="295" viewBox="0 0 760 295" role="img" aria-labelledby="title desc"><title id="title">字段顺序对结构体大小的影响</title><desc id="desc">S1 含 char int char，四字节对齐下共12字节，有6字节填充；S2 含 int char char，共8字节，有2字节填充。两侧按字节比例绘制。</desc><rect width="760" height="295" rx="20" fill="#f7faf8"/><g font-family="sans-serif" text-anchor="middle"><text x="97" y="50" font-size="23" fill="#294c50">S1</text><text x="97" y="178" font-size="23" fill="#294c50">S2</text><g stroke="#fff" stroke-width="2"><rect x="162" y="64" width="48" height="57" fill="#147f80"/><rect x="210" y="64" width="144" height="57" fill="#c9ceca"/><rect x="354" y="64" width="192" height="57" fill="#6e5ca8"/><rect x="546" y="64" width="48" height="57" fill="#147f80"/><rect x="594" y="64" width="144" height="57" fill="#c9ceca"/><rect x="162" y="191" width="192" height="57" fill="#6e5ca8"/><rect x="354" y="191" width="48" height="57" fill="#147f80"/><rect x="402" y="191" width="48" height="57" fill="#147f80"/><rect x="450" y="191" width="96" height="57" fill="#c9ceca"/></g><text x="186" y="99" font-size="18" fill="#fff">c</text><text x="282" y="99" font-size="20" fill="#344248">pad 3</text><text x="450" y="99" font-size="20" fill="#fff">int</text><text x="570" y="99" font-size="18" fill="#fff">d</text><text x="666" y="99" font-size="19" fill="#344248">pad 3</text><text x="258" y="225" font-size="20" fill="#fff">int</text><text x="378" y="225" font-size="19" fill="#fff">c</text><text x="426" y="225" font-size="19" fill="#fff">d</text><text x="498" y="225" font-size="19" fill="#344248">pad 2</text><text x="450" y="152" font-size="18" fill="#4c666b">12 字节：6 字节填充</text><text x="354" y="275" font-size="18" fill="#4c666b">8 字节：2 字节填充（LP64/x86-64 的常见布局）</text></g></svg>